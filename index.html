<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Max - Premium Live TV</title>
  <!-- HLS Video Player Script -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    /* Premium CSS Variables & Reset */
    :root {
      --bg-color: #0b0f19;
      --surface-color: #1a2235;
      --primary-color: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ef4444;
      --card-radius: 12px;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding-bottom: 40px; }

    /* Header */
    .navbar { background-color: rgba(11, 15, 25, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .brand { font-size: 24px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--primary-color); }
    .live-badge { background: var(--accent-red); color: white; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; letter-spacing: 1px; animation: pulse 2s infinite; }

    /* Search */
    .search-container { flex: 0 1 400px; position: relative; }
    .search-box { width: 100%; padding: 10px 15px 10px 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: var(--surface-color); color: #fff; font-size: 14px; outline: none; transition: var(--transition); }
    .search-box:focus { border-color: var(--primary-color); }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.5; }

    /* Content & Player */
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .player-section { background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); }
    .player-wrapper { width: 100%; aspect-ratio: 16/9; position: relative; background: #000; }
    
    video { width: 100%; height: 100%; display: block; object-fit: contain; border: none; }
    
    .now-playing { background: var(--surface-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .now-playing h2 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .now-playing p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    /* Categories */
    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .category-btn { background: var(--surface-color); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; white-space: nowrap; transition: var(--transition); }
    .category-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

    /* Grid System */
    .section-title { font-size: 20px; font-weight: 600; margin-bottom: 15px; }
    .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    
    .channel-card { background: var(--surface-color); border-radius: var(--card-radius); overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: var(--transition); position: relative; display: flex; flex-direction: column; }
    .channel-card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
    .card-banner { height: 120px; display: flex; align-items: center; justify-content: center; position: relative; text-align: center; padding: 10px; }
    .card-banner span { font-size: 22px; font-weight: bold; color: rgba(255,255,255,0.9); }
    
    .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); }
    .channel-card:hover .play-overlay { opacity: 1; }
    .play-icon { width: 40px; height: 40px; background: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; padding-left: 3px; font-size: 18px; color: #fff; }

    .card-info { padding: 15px; }
    .card-title { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .card-category { font-size: 12px; color: var(--text-muted); }
    .channel-card.active { border-color: var(--primary-color); box-shadow: 0 0 0 1px var(--primary-color); }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    @media (max-width: 768px) {
      .navbar { flex-direction: column; gap: 15px; align-items: flex-start; }
      .search-container { width: 100%; flex: 1; }
      .channel-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      .card-banner { height: 90px; }
      .card-banner span { font-size: 18px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand">IPTV<span>MAX</span> <span class="live-badge">LIVE</span></div>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-box" placeholder="चैनल का नाम खोजें..." onkeyup="filterChannels()">
    </div>
  </nav>

  <div class="container">
    <div class="player-section">
      <div class="player-wrapper">
        <video id="tvPlayer" controls autoplay playsinline></video>
      </div>
      <div class="now-playing">
        <div>
          <h2 id="nowPlayingTitle"><span style="color:var(--accent-red)">●</span> लोड हो रहा है...</h2>
          <p id="nowPlayingCat">कृपया प्रतीक्षा करें</p>
        </div>
      </div>
    </div>

    <div class="categories" id="categoryList">
      <button class="category-btn active" onclick="filterByCategory('All')">सभी चैनल्स</button>
      <button class="category-btn" onclick="filterByCategory('News')">न्यूज़</button>
      <button class="category-btn" onclick="filterByCategory('Music')">म्यूजिक</button>
      <button class="category-btn" onclick="filterByCategory('Global')">ग्लोबल</button>
    </div>

    <h3 class="section-title">लाइव चैनल्स (100% Working)</h3>
    
    <div class="channel-grid" id="channelGrid"></div>
  </div>

  <script>
    // 100% Working CORS-Free M3U8 Channels (No YouTube)
    const channels = [
      // News Channels
      { id: 1, name: "DW News", category: "News", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8", color: "linear-gradient(135deg, #0f766e, #134e4a)" },
      { id: 2, name: "Al Jazeera", category: "News", url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8", color: "linear-gradient(135deg, #d97706, #78350f)" },
      { id: 3, name: "France 24", category: "News", url: "https://static.france24.com/live/F24_EN_HI_HLS/live_web.m3u8", color: "linear-gradient(135deg, #2563eb, #1e3a8a)" },
      { id: 4, name: "CNA (Asia)", category: "News", url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48097f335b1d4/index.m3u8", color: "linear-gradient(135deg, #dc2626, #7f1d1d)" },
      
      // Music Channels
      { id: 5, name: "Clubbing TV", category: "Music", url: "https://clubbingtv-rakuten.amagi.tv/playlist.m3u8", color: "linear-gradient(135deg, #ec4899, #831843)" },
      { id: 6, name: "Qello Concerts", category: "Music", url: "https://stingray-qelloconcerts-1-eu.rakuten.wurl.tv/playlist.m3u8", color: "linear-gradient(135deg, #8b5cf6, #4c1d95)" },
      { id: 7, name: "Monstercat", category: "Music", url: "https://monstercat-monstercat-1-eu.rakuten.wurl.tv/playlist.m3u8", color: "linear-gradient(135deg, #d946ef, #701a75)" },
      
      // Global / Entertainment
      { id: 8, name: "Red Bull TV", category: "Global", url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8", color: "linear-gradient(135deg, #ea580c, #7c2d12)" },
      { id: 9, name: "NASA TV", category: "Global", url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8", color: "linear-gradient(135deg, #475569, #1e293b)" },
      { id: 10, name: "Fashion TV", category: "Global", url: "https://fash1043.cloudycdn.services/slive/_definst_/ftv_midas_main/playlist.m3u8", color: "linear-gradient(135deg, #16a34a, #14532d)" }
    ];

    const video = document.getElementById("tvPlayer");
    const nowPlayingTitle = document.getElementById("nowPlayingTitle");
    const nowPlayingCat = document.getElementById("nowPlayingCat");
    const grid = document.getElementById("channelGrid");
    
    let currentCategory = 'All';
    let hls = null;

    function playChannel(id) {
      const ch = channels.find(c => c.id === id);
      if(!ch) return;

      nowPlayingTitle.innerHTML = `<span style="color:var(--accent-red)">●</span> ${ch.name} (LIVE)`;
      nowPlayingCat.innerText = `कैटेगरी: ${ch.category}`;
      
      document.querySelectorAll(".channel-card").forEach(card => card.classList.remove("active"));
      const activeCard = document.getElementById(`card-${id}`);
      if(activeCard) activeCard.classList.add("active");

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(e => console.log("Playback error:", e));
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = ch.url;
        video.play().catch(e => console.log("Playback error:", e));
      }
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderGrid(channelsToRender) {
      grid.innerHTML = "";
      channelsToRender.forEach(ch => {
        const div = document.createElement("div");
        div.className = "channel-card";
        div.id = `card-${ch.id}`;
        div.onclick = () => playChannel(ch.id);
        
        const shortName = ch.name.length > 12 ? ch.name.substring(0, 8) + '...' : ch.name;
        
        div.innerHTML = `
          <div class="card-banner" style="background: ${ch.color};">
            <span>${shortName.toUpperCase()}</span>
            <div class="play-overlay"><div class="play-icon">▶</div></div>
          </div>
          <div class="card-info">
            <div class="card-title">${ch.name}</div>
            <div class="card-category">${ch.category}</div>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function filterChannels() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      let filtered = channels.filter(ch => ch.name.toLowerCase().includes(query));
      if (currentCategory !== 'All') filtered = filtered.filter(ch => ch.category === currentCategory);
      renderGrid(filtered);
    }

    function filterByCategory(category) {
      currentCategory = category;
      document.querySelectorAll(".category-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");

      let filtered = channels;
      if (category !== 'All') filtered = channels.filter(ch => ch.category === category);
      
      const query = document.getElementById("searchInput").value.toLowerCase();
      if (query) filtered = filtered.filter(ch => ch.name.toLowerCase().includes(query));
      
      renderGrid(filtered);
    }

    renderGrid(channels);
    
    // लोड होते ही पहला चैनल (DW News) प्ले करें
    setTimeout(() => { playChannel(1); }, 500);
  </script>
</body>
</html>
