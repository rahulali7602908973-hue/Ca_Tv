<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Star TV - Live TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #07090e;
      --surface: #0f172a;
      --surface-card: #131d33;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --text: #f8fafc;
      --muted: #94a3b8;
      --red: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(59, 130, 246, 0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 50px; }

    .navbar {
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(16px);
      position: sticky; top: 0; z-index: 100;
      padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .menu-icon { font-size: 24px; cursor: pointer; color: var(--text); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 800; }
    .brand span { 
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .live-badge {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff; font-size: 10px; font-weight: 800;
      padding: 3px 8px; border-radius: 6px; margin-left: 6px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 13px; }
    .search-box {
      width: 100%; max-width: 280px; padding: 10px 16px 10px 38px;
      border-radius: 30px; border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05); color: var(--text); font-size: 13px; outline: none;
    }
    .search-box:focus { border-color: var(--primary); }

    .container { max-width: 1180px; margin: 0 auto; padding: 20px 16px; }

    .player-box {
      background: #000; border-radius: 16px; overflow: hidden;
      margin-bottom: 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
    }
    .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; }

    .now-playing {
      background: var(--surface); padding: 16px 22px;
      border-top: 1px solid var(--border);
    }
    .now-playing h2 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .now-playing p { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .cats { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 22px; }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 8px 18px; border-radius: 24px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
      cursor: pointer; transition: all 0.2s;
    }
    .cat-btn:hover { color: #fff; }
    .cat-btn.active {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .card {
      background: var(--surface-card); border-radius: 14px; overflow: hidden;
      cursor: pointer; border: 1px solid var(--border); position: relative;
      transition: all 0.2s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--border-hover); }
    .banner { height: 95px; display: flex; align-items: center; justify-content: center; position: relative; }
    .banner span { font-size: 13px; font-weight: 800; color: #fff; padding: 0 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
    
    /* Offline Badge UI */
    .offline-badge {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8);
      color: var(--red); font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; border: 1px solid var(--red);
    }

    .info { padding: 12px 14px; background: var(--surface-card); }
    .name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat-label { font-size: 11.5px; color: var(--muted); margin-top: 3px; font-weight: 500; }

    /* Admin Panel Overlay */
    .admin-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
      z-index: 1000; display: none; align-items: center; justify-content: center;
    }
    .admin-panel {
      background: var(--surface); width: 90%; max-width: 500px; border-radius: 16px;
      padding: 24px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto;
    }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .admin-header h2 { font-size: 18px; color: var(--primary); }
    .close-btn { cursor: pointer; font-size: 20px; }
    .admin-section { background: var(--surface-card); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .admin-section h3 { font-size: 14px; margin-bottom: 10px; color: var(--muted); }
    .admin-input { width: 100%; padding: 10px; margin-bottom: 10px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    .admin-btn { background: var(--primary); color: #fff; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    .admin-btn.danger { background: var(--red); }
    .viewer-list { font-size: 13px; margin-top: 10px; }
    .viewer-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="menu-icon" onclick="toggleAdmin()">☰</div>
      <div class="brand">
        <div>STAR <span>TV</span><span class="live-badge">LIVE</span></div>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-box" placeholder="Search channels...">
    </div>
  </nav>

  <div class="container">
    <div class="player-box">
      <div class="player-wrap">
        <video id="tvPlayer" controls></video>
      </div>
      <div class="now-playing">
        <h2><span style="color:var(--red)">●</span> Select a Channel</h2>
        <p>Ready to stream</p>
      </div>
    </div>

    <div class="cats">
      <button class="cat-btn active">All</button>
      <button class="cat-btn">Bangla</button>
      <button class="cat-btn">News</button>
      <button class="cat-btn">Movies</button>
    </div>

    <h3 class="section-title">Live Channels</h3>
    <div class="grid" id="channelGrid">
      <!-- Dummy Channel with Offline Badge -->
      <div class="card">
        <div class="banner" style="background: linear-gradient(135deg, #1e3a8a, #0f172a)">
          <span>STAR JALSHA</span>
        </div>
        <div class="info">
          <div class="name">Star Jalsha</div>
          <div class="cat-label">Bangla</div>
        </div>
      </div>
      
      <div class="card" style="opacity: 0.6;">
        <div class="banner" style="background: linear-gradient(135deg, #991b1b, #450a0a)">
          <span>OFFLINE CH</span>
          <div class="offline-badge">OFFLINE</div>
        </div>
        <div class="info">
          <div class="name">Test Channel</div>
          <div class="cat-label">Entertainment</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Admin Panel UI Mockup -->
  <div class="admin-overlay" id="adminOverlay">
    <div class="admin-panel">
      <div class="admin-header">
        <h2>Admin Dashboard</h2>
        <div class="close-btn" onclick="toggleAdmin()">✖</div>
      </div>

      <div class="admin-section">
        <h3>Website Name</h3>
        <input type="text" class="admin-input" placeholder="Enter new name (e.g. Star TV)">
        <button class="admin-btn">Update Name</button>
      </div>

      <div class="admin-section">
        <h3>Add / Manage Channel</h3>
        <input type="text" class="admin-input" placeholder="Channel Name">
        <input type="text" class="admin-input" placeholder="Stream URL (.m3u8)">
        <button class="admin-btn" style="margin-bottom: 10px;">Add Channel</button>
        <button class="admin-btn danger">Remove Selected Channel</button>
      </div>

      <div class="admin-section">
        <h3>Live Viewers (Mockup)</h3>
        <p style="color: #fff; font-weight: bold; margin-bottom: 10px;">Active Users: 3</p>
        <div class="viewer-list">
          <div class="viewer-item">
            <span>User #1042 (IP: 192.168.x.x)</span>
            <button style="background: var(--red); border: none; color: white; padding: 2px 8px; cursor: pointer; border-radius: 3px;">Kick</button>
          </div>
          <div class="viewer-item">
            <span>User #1043 (IP: 10.0.x.x)</span>
            <button style="background: var(--red); border: none; color: white; padding: 2px 8px; cursor: pointer; border-radius: 3px;">Kick</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Toggle Admin Panel
    function toggleAdmin() {
      const panel = document.getElementById('adminOverlay');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    }
  </script>
</body>
</html>
