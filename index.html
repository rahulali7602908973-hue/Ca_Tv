<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>Star Entertainment Live</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #f3f4f6; min-height: 100vh; padding-bottom: 40px; }

    /* Header */
    .header {
      background: #111827; padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937;
      position: sticky; top: 0; z-index: 50;
    }
    .brand { font-size: 18px; font-weight: 800; color: #3b82f6; }
    .brand span { color: #ef4444; }
    .admin-btn {
      background: #1f2937; color: #9ca3af; border: 1px solid #374151; padding: 7px 12px;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .admin-btn:hover { background: #374151; color: #fff; }

    .container { max-width: 1000px; margin: 0 auto; padding: 12px; }

    /* Video Player */
    .player-box { background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
    .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .player-info { padding: 10px 14px; background: #111827; border-top: 1px solid #1f2937; }
    .player-info h3 { font-size: 15px; }
    .player-info p { font-size: 12px; color: #9ca3af; margin-top: 2px; }

    /* Filter & Search */
    .controls { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .search-input {
      flex: 1; min-width: 150px; background: #1f2937; border: 1px solid #374151;
      padding: 8px 12px; border-radius: 6px; color: #fff; font-size: 13px; outline: none;
    }
    .cat-btn {
      background: #1f2937; border: 1px solid #374151; color: #9ca3af;
      padding: 7px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    .cat-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .card {
      background: #111827; border: 1px solid #1f2937; border-radius: 8px;
      overflow: hidden; cursor: pointer;
    }
    .card.active { border-color: #3b82f6; box-shadow: 0 0 0 2px #3b82f6; }
    .card-banner {
      height: 75px; background: linear-gradient(135deg, #1e3a8a, #0f172a);
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 6px; font-size: 12px; font-weight: 700; color: #fff;
    }
    .card-body { padding: 8px; }
    .card-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Modals */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: #111827; border: 1px solid #374151; width: 100%; max-width: 480px;
      border-radius: 8px; padding: 16px; max-height: 90vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #1f2937;
    }
    .modal-header h4 { font-size: 15px; }
    .close-btn { background: none; border: none; color: #9ca3af; font-size: 20px; cursor: pointer; }
    
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 4px; }
    .form-input {
      width: 100%; padding: 8px 10px; background: #1f2937; border: 1px solid #374151;
      border-radius: 6px; color: #fff; font-size: 13px; outline: none;
    }
    .btn {
      background: #2563eb; color: #fff; border: none; padding: 8px 14px;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-danger { background: #dc2626; }
    .error-text { color: #ef4444; font-size: 12px; margin-top: 6px; display: none; }

    /* Admin Channel Item List */
    .admin-list { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
    .admin-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #1f2937; padding: 8px 10px; border-radius: 6px;
    }
    .admin-item span { font-size: 12px; }
    .del-btn {
      background: rgba(239, 68, 68, 0.2); color: #ef4444; border: none;
      padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;
    }
    .del-btn:hover { background: #ef4444; color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">STAR <span>LIVE</span></div>
    <button class="admin-btn" onclick="handleAdminClick()">🔒 Admin Panel</button>
  </div>

  <div class="container">
    <!-- Player -->
    <div class="player-box">
      <div class="player-wrap">
        <video id="tvPlayer" controls playsinline webkit-playsinline></video>
      </div>
      <div class="player-info">
        <h3 id="playerTitle">Select a Channel</h3>
        <p id="playerStatus">Click any channel card below to start playing</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="controls">
      <input type="text" id="searchBox" class="search-input" placeholder="Search channels..." oninput="render()">
      <button class="cat-btn active" onclick="setCategory('All', this)">All</button>
      <button class="cat-btn" onclick="setCategory('Bangla', this)">Bangla</button>
      <button class="cat-btn" onclick="setCategory('Hindi', this)">Hindi</button>
    </div>

    <!-- Grid -->
    <div class="grid" id="channelGrid"></div>
  </div>

  <!-- 1. Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-box" style="max-width: 320px;">
      <div class="modal-header">
        <h4>Admin Authentication</h4>
        <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
      </div>
      <div class="form-group">
        <label>Admin ID</label>
        <input type="text" id="adminUser" class="form-input" placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" class="form-input" placeholder="admin123" onkeypress="if(event.key==='Enter') verifyLogin()">
      </div>
      <div class="error-text" id="loginErr">Wrong ID or Password!</div>
      <div style="margin-top: 14px;">
        <button class="btn" style="width: 100%;" onclick="verifyLogin()">Login</button>
      </div>
    </div>
  </div>

  <!-- 2. Secure Admin Panel Modal -->
  <div class="modal" id="adminPanelModal">
    <div class="modal-box">
      <div class="modal-header">
        <h4>⚙️ Channel Manager</h4>
        <button class="close-btn" onclick="closeModal('adminPanelModal')">&times;</button>
      </div>

      <!-- Add New Channel Form -->
      <div style="background: #1f2937; padding: 12px; border-radius: 6px; margin-bottom: 14px;">
        <h5 style="margin-bottom: 8px; font-size: 13px;">Add New Stream</h5>
        <div class="form-group">
          <label>Channel Name</label>
          <input type="text" id="addName" class="form-input" placeholder="e.g. Aaj Tak">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="addCat" class="form-input">
            <option value="Bangla">Bangla</option>
            <option value="Hindi">Hindi</option>
          </select>
        </div>
        <div class="form-group">
          <label>Stream URL (.m3u8)</label>
          <input type="text" id="addUrl" class="form-input" placeholder="https://domain.com/live.m3u8">
        </div>
        <button class="btn" onclick="saveNewChannel()">+ Add Channel</button>
      </div>

      <!-- Quick Action Buttons -->
      <div style="display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px;">
        <button class="btn btn-danger" onclick="resetChannels()">⚠️ Reset All Channels</button>
        <button class="cat-btn" onclick="adminLogout()">Log Out</button>
      </div>

      <!-- Existing Channels List -->
      <h5 style="font-size: 13px; margin-bottom: 6px;">Manage Existing Channels</h5>
      <div class="admin-list" id="adminListContainer"></div>
    </div>
  </div>

  <script>
    const DEFAULT_LIST = [
      { id: 1, name: "ABP Ananda", cat: "Bangla", url: "https://abpanandahls.akamaized.net/hls/live/2021588/abpanandahls/master.m3u8" },
      { id: 2, name: "News18 Bangla", cat: "Bangla", url: "https://n18bangla.akamaized.net/hls/live/2014264/n18bangla/master.m3u8" },
      { id: 3, name: "Aaj Tak HD", cat: "Hindi", url: "https://feeds.intoday.in/aajtak/api/aajtakhd/master.m3u8" },
      { id: 4, name: "India TV", cat: "Hindi", url: "https://indiatvnews.akamaized.net/hls/live/2028682/indiatv/master.m3u8" },
      { id: 5, name: "ABP News", cat: "Hindi", url: "https://abphindi.akamaized.net/hls/live/2021587/abphindi/master.m3u8" },
      { id: 6, name: "Republic Bharat", cat: "Hindi", url: "https://rbharat.akamaized.net/hls/live/2014265/rbharat/master.m3u8" }
    ];

    let channels = [];
    let activeCat = "All";
    let activeId = null;
    let hls = null;
    let isLogged = false;

    const video = document.getElementById("tvPlayer");
    const pTitle = document.getElementById("playerTitle");
    const pStatus = document.getElementById("playerStatus");
    const grid = document.getElementById("channelGrid");
    const search = document.getElementById("searchBox");

    function loadData() {
      try {
        const saved = localStorage.getItem("star_secure_channels");
        channels = saved ? JSON.parse(saved) : DEFAULT_LIST;
      } catch(e) {
        channels = DEFAULT_LIST;
      }
      render();
    }

    function saveData() {
      localStorage.setItem("star_secure_channels", JSON.stringify(channels));
    }

    function render() {
      const q = search.value.toLowerCase().trim();
      grid.innerHTML = "";

      const filtered = channels.filter(c => {
        const matchCat = (activeCat === "All" || c.cat === activeCat);
        const matchSearch = c.name.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #6b7280; padding: 20px;">No channels found.</div>`;
        return;
      }

      filtered.forEach(c => {
        const card = document.createElement("div");
        card.className = `card ${activeId === c.id ? 'active' : ''}`;
        card.onclick = () => playStream(c);

        card.innerHTML = `
          <div class="card-banner">${c.name}</div>
          <div class="card-body">
            <div class="card-title">${c.name}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function playStream(c) {
      activeId = c.id;
      pTitle.innerText = c.name;
      pStatus.innerText = "Connecting...";
      render();

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(c.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().then(() => {
            pStatus.innerText = "Playing Live • Sound Enabled";
          }).catch(() => {
            video.muted = true;
            video.play();
            pStatus.innerText = "Playing Muted • Click video to unmute";
          });
        });
        hls.on(Hls.Events.ERROR, () => {
          pStatus.innerText = "Stream offline or invalid link";
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = c.url;
        video.play();
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setCategory(cat, el) {
      activeCat = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
      render();
    }

    /* Admin & Security Functions */
    function handleAdminClick() {
      if (isLogged) {
        openAdminPanel();
      } else {
        document.getElementById("loginErr").style.display = "none";
        document.getElementById("adminUser").value = "";
        document.getElementById("adminPass").value = "";
        document.getElementById("loginModal").classList.add("show");
      }
    }

    function verifyLogin() {
      const u = document.getElementById("adminUser").value.trim();
      const p = document.getElementById("adminPass").value.trim();

      if (u === "admin" && p === "admin123") {
        isLogged = true;
        closeModal("loginModal");
        openAdminPanel();
      } else {
        document.getElementById("loginErr").style.display = "block";
      }
    }

    function openAdminPanel() {
      renderAdminList();
      document.getElementById("adminPanelModal").classList.add("show");
    }

    function adminLogout() {
      isLogged = false;
      closeModal("adminPanelModal");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("show");
    }

    function renderAdminList() {
      const container = document.getElementById("adminListContainer");
      container.innerHTML = "";
      channels.forEach(c => {
        const row = document.createElement("div");
        row.className = "admin-item";
        row.innerHTML = `
          <span>${c.name} (${c.cat})</span>
          <button class="del-btn" onclick="deleteChannel(${c.id})">Delete</button>
        `;
        container.appendChild(row);
      });
    }

    function saveNewChannel() {
      const name = document.getElementById("addName").value.trim();
      const cat = document.getElementById("addCat").value;
      const url = document.getElementById("addUrl").value.trim();

      if (!name || !url) {
        alert("Enter both Name and URL");
        return;
      }

      channels.unshift({ id: Date.now(), name, cat, url });
      saveData();
      render();
      renderAdminList();

      document.getElementById("addName").value = "";
      document.getElementById("addUrl").value = "";
      alert(`Channel "${name}" added!`);
    }

    function deleteChannel(id) {
      if (!confirm("Delete this channel?")) return;
      channels = channels.filter(c => c.id !== id);
      saveData();
      render();
      renderAdminList();
    }

    function resetChannels() {
      if (confirm("Reset all channels to default list?")) {
        channels = [...DEFAULT_LIST];
        saveData();
        render();
        renderAdminList();
        alert("Reset complete!");
      }
    }

    loadData();
  </script>
</body>
</html>
