<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Star TV</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root{--bg:#07090e;--surface:#0f172a;--surface-card:#131d33;--primary:#3b82f6;--text:#f8fafc;--muted:#94a3b8;--red:#ef4444;--green:#10b981;--border:rgba(255,255,255,0.08)}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
    body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:50px}
    .notice-bar{background:var(--red);color:#fff;padding:5px 15px;font-size:13px;font-weight:600;display:none}
    .navbar{background:rgba(7,9,14,.85);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
    .nav-left{display:flex;align-items:center;gap:15px}
    .menu-icon{font-size:24px;cursor:pointer}
    .brand{font-size:19px;font-weight:800}.brand span{color:var(--primary)}
    .search-box{padding:8px 15px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:#fff;outline:none;font-size:13px;width:100%;max-width:250px}
    .container{max-width:1180px;margin:0 auto;padding:20px 16px}
    .player-box{background:#000;border-radius:16px;overflow:hidden;margin-bottom:24px;border:1px solid var(--border)}
    .player-wrap{width:100%;aspect-ratio:16/9;background:#000}
    video{width:100%;height:100%;object-fit:contain}
    .now-playing{background:var(--surface);padding:16px 22px;border-top:1px solid var(--border)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:20px}
    .card{background:var(--surface-card);border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--border);position:relative}
    .card:hover{border-color:var(--primary)}
    .banner{height:95px;display:flex;align-items:center;justify-content:center;background:#1e3a8a}
    .banner span{font-size:13px;font-weight:800;padding:0 10px;text-transform:uppercase}
    .info{padding:12px 14px}
    .name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cat-label{font-size:11.5px;color:var(--muted);margin-top:3px}
    .offline-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);color:var(--red);font-size:10px;padding:3px 6px;border-radius:4px;font-weight:bold;border:1px solid var(--red)}
    .card.offline{opacity:.5;pointer-events:none}
    .admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:none;align-items:center;justify-content:center;padding:10px}
    .admin-panel{background:var(--surface);width:100%;max-width:650px;border-radius:16px;padding:24px;border:1px solid var(--border);max-height:90vh;overflow-y:auto}
    .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:10px}
    .close-btn{cursor:pointer;font-size:20px;color:var(--red);font-weight:bold}
    .stats-box{display:flex;gap:10px;margin-bottom:15px}
    .stat{flex:1;background:var(--surface-card);padding:10px;border-radius:8px;text-align:center;border:1px solid var(--border)}
    .stat span{font-size:18px;font-weight:bold;color:var(--primary);display:block}
    .stat div{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:5px}
    .admin-section{background:var(--surface-card);padding:15px;border-radius:10px;margin-bottom:15px;border:1px solid var(--border)}
    .admin-input{width:100%;padding:12px;margin-bottom:10px;background:#000;border:1px solid var(--border);color:#fff;border-radius:6px}
    .admin-btn{background:var(--primary);color:#fff;padding:10px 16px;border:none;border-radius:6px;cursor:pointer;width:100%;font-weight:bold}
    .admin-ch-list{max-height:280px;overflow-y:auto;margin-top:10px}
    .admin-ch-item{display:flex;justify-content:space-between;align-items:center;background:#000;padding:10px;border-radius:6px;margin-bottom:8px;border:1px solid var(--border)}
    .ch-actions button{padding:5px 10px;border:none;border-radius:4px;cursor:pointer;color:#fff;margin-left:5px;font-size:11px}
    .btn-edit{background:var(--primary)}.btn-off{background:#d97706}.btn-del{background:var(--red)}
    #loginView,#dashboardView{display:none}
  </style>
</head>
<body>
  <div class="notice-bar" id="noticeBar"><marquee id="marqueeText" scrollamount="5"></marquee></div>
  <nav class="navbar">
    <div class="nav-left">
      <div class="menu-icon" onclick="openMenu()">☰</div>
      <div class="brand">STAR <span>TV</span></div>
    </div>
    <input type="text" id="homeSearch" class="search-box" placeholder="Search Channels..." onkeyup="renderFrontend()">
  </nav>
  <div class="container">
    <div class="player-box">
      <div class="player-wrap"><video id="tvPlayer" controls playsinline></video></div>
      <div class="now-playing"><h2 id="nowTitle"><span style="color:var(--red)">●</span> Select a Channel</h2></div>
    </div>
    <h3 style="font-size:18px;margin-bottom:15px;">Live Channels</h3>
    <div class="grid" id="channelGrid">Loading...</div>
  </div>

  <!-- Menu -->
  <div class="admin-overlay" id="menuOverlay">
    <div class="admin-panel" style="max-width:400px">
      <div class="admin-header"><h2>Menu</h2><div class="close-btn" onclick="closeMenu()">✖</div></div>
      <div class="admin-section" style="text-align:center">
        <h3 style="margin-bottom:15px;color:var(--primary)">Contact Us</h3>
        <p style="color:var(--muted);font-size:14px;margin-bottom:8px">📧 <span id="displayEmail" style="color:#fff"></span></p>
        <p style="color:var(--muted);font-size:14px;margin-bottom:20px">📞 <span id="displayPhone" style="color:#fff"></span></p>
      </div>
      <button class="admin-btn" style="background:transparent;border:1px solid var(--border);color:var(--muted)" onclick="closeMenu();openAdmin()">Admin Login 🔒</button>
    </div>
  </div>

  <!-- Admin -->
  <div class="admin-overlay" id="adminOverlay">
    <div class="admin-panel">
      <div id="loginView">
        <div class="admin-header"><h2>Admin Login</h2><div class="close-btn" onclick="closeAdmin()">✖</div></div>
        <input type="password" id="adminPass" class="admin-input" placeholder="Password">
        <button class="admin-btn" onclick="checkLogin()">Login</button>
      </div>
      <div id="dashboardView">
        <div class="admin-header"><h2>Admin Dashboard</h2><div class="close-btn" onclick="closeAdmin()">✖</div></div>
        <div class="stats-box">
          <div class="stat"><span id="statTotal">0</span><div>Total</div></div>
          <div class="stat"><span id="statOnline" style="color:var(--green)">0</span><div>Online</div></div>
          <div class="stat"><span id="statOffline" style="color:var(--red)">0</span><div>Offline</div></div>
        </div>
        <div class="admin-section">
          <h3 id="formTitle" style="margin-bottom:10px">Add / Edit Channel</h3>
          <input type="hidden" id="editKey">
          <input type="text" id="chName" class="admin-input" placeholder="Channel Name">
          <select id="chCat" class="admin-input">
            <option value="" disabled selected>Category</option>
            <option value="News">News</option>
            <option value="Bangla">Bangla</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Sports">Sports</option>
            <option value="Movies">Movies</option>
            <option value="Music">Music</option>
          </select>
          <input type="text" id="chUrl" class="admin-input" placeholder="m3u8 URL">
          <button class="admin-btn" id="saveBtn" onclick="saveChannel()">+ Add Channel</button>
        </div>
        <div class="admin-section">
          <h3 style="margin-bottom:10px">Contact & Notice</h3>
          <input type="email" id="adminContactEmail" class="admin-input" placeholder="Email">
          <input type="text" id="adminContactPhone" class="admin-input" placeholder="Phone">
          <button class="admin-btn" style="background:#f59e0b;margin-bottom:12px" onclick="updateContact()">Update Contact</button>
          <input type="text" id="adminNotice" class="admin-input" placeholder="Marquee text">
          <button class="admin-btn" style="background:#8b5cf6" onclick="updateNotice()">Update Notice</button>
        </div>
        <div class="admin-section">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <h3>Manage Channels</h3>
            <input type="text" id="adminSearch" class="search-box" style="width:140px;padding:5px 10px" placeholder="Search" onkeyup="renderAdminList()">
          </div>
          <div class="admin-ch-list" id="adminChList"></div>
        </div>
        <div class="admin-section">
          <h3 style="margin-bottom:10px">Security</h3>
          <input type="password" id="newAdminPass" class="admin-input" placeholder="New Password">
          <button class="admin-btn" style="background:var(--green)" onclick="changePassword()">Change Password</button>
          <button class="admin-btn" style="background:#ef4444;margin-top:10px" onclick="resetChannels()">Reset to Default Channels</button>
        </div>
      </div>
    </div>
  </div>

<script>
let hls = null;
let allData = {};
let settings = {
  admin_password: "admin123",
  notice: "Star TV - Free Indian + Bangladeshi Channels",
  contact: {email:"support@startv.com", phone:"+91 0000000000"}
};

const DEFAULT_CHANNELS = {
  // Hindi News
  "n1": {name:"Aaj Tak", category:"News", url:"https://feeds.intoday.in/aajtak/api/aajtaktv/master.m3u8", isOffline:false},
  "n2": {name:"NDTV India", category:"News", url:"https://ndtvindiaelemarchana.akamaized.net/hls/live/2003679/ndtvindia/master.m3u8", isOffline:false},
  "n3": {name:"ABP News", category:"News", url:"https://d2l4ar6y3mrs4k.cloudfront.net/live-streaming/abpnews-livetv/master.m3u8", isOffline:false},
  "n4": {name:"News18 India", category:"News", url:"https://nw18live.cdn.jio.com/bpk-tv/News18_India_NW18_MOB/output01/index.m3u8", isOffline:false},
  "n5": {name:"CNN-News18", category:"News", url:"https://nw18live.cdn.jio.com/bpk-tv/CNN_News18_NW18_MOB/output01/index.m3u8", isOffline:false},
  "n6": {name:"NDTV 24x7", category:"News", url:"https://ndtv24x7elemarchana.akamaized.net/hls/live/2003678/ndtv24x7/master.m3u8", isOffline:false},
  "n7": {name:"NDTV Profit", category:"News", url:"https://ndtvprofit.akamaized.net/hls/live/2107404/ndtvprofit/master_1.m3u8", isOffline:false},
  "n8": {name:"India TV", category:"News", url:"https://pl-indiatvnews.akamaized.net/out/v1/db79179b608641ceaa5a4d0dd0dca8da/index.m3u8", isOffline:false},

  // Bangla / Bangladeshi
  "b1": {name:"ABP Ananda", category:"Bangla", url:"https://d2l4ar6y3mrs4k.cloudfront.net/live-streaming/ananda-livetv/master.m3u8", isOffline:false},
  "b2": {name:"Somoy TV", category:"Bangla", url:"https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/index.m3u8", isOffline:false},
  "b3": {name:"Jamuna TV", category:"Bangla", url:"https://owrcovcrpy.gpcdn.net/bpk-tv/1701/output/index.m3u8", isOffline:false},
  "b4": {name:"Channel 24", category:"Bangla", url:"https://owrcovcrpy.gpcdn.net/bpk-tv/1703/output/index.m3u8", isOffline:false},
  "b5": {name:"Independent TV", category:"Bangla", url:"https://owrcovcrpy.gpcdn.net/bpk-tv/1704/output/index.m3u8", isOffline:false},
  "b6": {name:"Ekattor TV", category:"Bangla", url:"https://owrcovcrpy.gpcdn.net/bpk-tv/1705/output/index.m3u8", isOffline:false},
  "b7": {name:"BTV", category:"Bangla", url:"https://owrcovcrpy.gpcdn.net/bpk-tv/1709/output/index.m3u8", isOffline:false},
  "b8": {name:"Channel I", category:"Bangla", url:"https://owrcovcrpy.gpcdn.net/bpk-tv/1723/output/index.m3u8", isOffline:false},

  // Extra
  "e1": {name:"Red Bull TV", category:"Sports", url:"https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8", isOffline:false},
  "e2": {name:"NASA TV", category:"Entertainment", url:"https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8", isOffline:false},
  "e3": {name:"Big Buck Bunny", category:"Movies", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", isOffline:false}
};

function initApp(){
  try{
    let saved = localStorage.getItem('startv_channels');
    if(saved) allData = JSON.parse(saved);
    if(!allData || Object.keys(allData).length < 8){
      allData = JSON.parse(JSON.stringify(DEFAULT_CHANNELS));
      localStorage.setItem('startv_channels', JSON.stringify(allData));
    }
    let s = localStorage.getItem('startv_settings');
    if(s) settings = JSON.parse(s);
    applySettings();
    updateStats();
    renderFrontend();
    renderAdminList();
  }catch(e){
    allData = JSON.parse(JSON.stringify(DEFAULT_CHANNELS));
    localStorage.setItem('startv_channels', JSON.stringify(allData));
    applySettings();
    updateStats();
    renderFrontend();
    renderAdminList();
  }
}

function saveLocalData(){ localStorage.setItem('startv_channels', JSON.stringify(allData)); }
function saveSettings(){ localStorage.setItem('startv_settings', JSON.stringify(settings)); }

function applySettings(){
  if(settings.notice){
    document.getElementById('marqueeText').innerText = settings.notice;
    document.getElementById('noticeBar').style.display = 'block';
  } else document.getElementById('noticeBar').style.display = 'none';
  document.getElementById('displayEmail').innerText = settings.contact.email||'';
  document.getElementById('displayPhone').innerText = settings.contact.phone||'';
  document.getElementById('adminContactEmail').value = settings.contact.email||'';
  document.getElementById('adminContactPhone').value = settings.contact.phone||'';
  document.getElementById('adminNotice').value = settings.notice||'';
}

function updateStats(){
  let t=0,o=0,f=0;
  Object.values(allData).forEach(c=>{t++; c.isOffline?f++:o++});
  document.getElementById('statTotal').innerText=t;
  document.getElementById('statOnline').innerText=o;
  document.getElementById('statOffline').innerText=f;
}

function renderFrontend(){
  const grid = document.getElementById('channelGrid');
  const q = (document.getElementById('homeSearch').value||'').toLowerCase();
  grid.innerHTML = '';
  const keys = Object.keys(allData).filter(k=>allData[k].name.toLowerCase().includes(q));
  if(!keys.length){ grid.innerHTML='<div style="color:var(--muted);grid-column:1/-1;padding:20px">No channels</div>'; return; }
  keys.forEach(k=>{
    const ch = allData[k];
    const card = document.createElement('div');
    card.className = 'card'+(ch.isOffline?' offline':'');
    card.onclick = ()=>{ if(!ch.isOffline) playChannel(ch); };
    let col = '#1e3a8a';
    if(ch.category==='News') col='#991b1b';
    else if(ch.category==='Bangla') col='#7c3aed';
    else if(ch.category==='Sports') col='#065f46';
    else if(ch.category==='Movies') col='#581c87';
    card.innerHTML = `<div class="banner" style="background:\( {col}"><span> \){ch.name.substring(0,12)}</span>\( {ch.isOffline?'<div class="offline-badge">OFFLINE</div>':''}</div><div class="info"><div class="name"> \){ch.name}</div><div class="cat-label">${ch.category}</div></div>`;
    grid.appendChild(card);
  });
}

function renderAdminList(){
  const list = document.getElementById('adminChList');
  const q = (document.getElementById('adminSearch').value||'').toLowerCase();
  list.innerHTML = '';
  Object.keys(allData).filter(k=>allData[k].name.toLowerCase().includes(q)).forEach(k=>{
    const ch = allData[k];
    const item = document.createElement('div');
    item.className = 'admin-ch-item';
    item.innerHTML = `<div style="font-size:13px;font-weight:bold">\( {ch.name} <span style="font-weight:normal;color:#888">( \){ch.category})</span></div>
      <div class="ch-actions">
        <button class="btn-edit" onclick="editChannel('${k}')">Edit</button>
        <button class="btn-off" onclick="toggleOffline('\( {k}')"> \){ch.isOffline?'Online':'Offline'}</button>
        <button class="btn-del" onclick="deleteChannel('${k}')">Del</button>
      </div>`;
    list.appendChild(item);
  });
}

function saveChannel(){
  const key = document.getElementById('editKey').value;
  const name = document.getElementById('chName').value.trim();
  const category = document.getElementById('chCat').value || 'General';
  const url = document.getElementById('chUrl').value.trim();
  if(!name||!url) return alert('Name & URL required');
  if(key){
    allData[key] = {...allData[key], name, category, url};
    document.getElementById('editKey').value='';
    document.getElementById('formTitle').innerText='Add / Edit Channel';
    document.getElementById('saveBtn').innerText='+ Add Channel';
    alert('Updated');
  } else {
    allData['ch_'+Date.now()] = {name, category, url, isOffline:false};
    alert('Added');
  }
  saveLocalData(); updateStats(); renderFrontend(); renderAdminList();
  document.getElementById('chName').value='';
  document.getElementById('chUrl').value='';
  document.getElementById('chCat').value='';
}

function editChannel(k){
  const ch = allData[k];
  document.getElementById('editKey').value = k;
  document.getElementById('chName').value = ch.name;
  document.getElementById('chCat').value = ch.category;
  document.getElementById('chUrl').value = ch.url;
  document.getElementById('formTitle').innerText = 'Edit Channel';
  document.getElementById('saveBtn').innerText = 'Update Channel';
}

function deleteChannel(k){ if(confirm('Delete?')){ delete allData[k]; saveLocalData(); updateStats(); renderFrontend(); renderAdminList(); } }
function toggleOffline(k){ allData[k].isOffline = !allData[k].isOffline; saveLocalData(); updateStats(); renderFrontend(); renderAdminList(); }

function resetChannels(){
  if(confirm('Reset all channels to default?')){
    allData = JSON.parse(JSON.stringify(DEFAULT_CHANNELS));
    saveLocalData();
    updateStats();
    renderFrontend();
    renderAdminList();
    alert('Default channels loaded!');
  }
}

function updateNotice(){ settings.notice = document.getElementById('adminNotice').value; saveSettings(); applySettings(); alert('Updated'); }
function updateContact(){ settings.contact.email = document.getElementById('adminContactEmail').value; settings.contact.phone = document.getElementById('adminContactPhone').value; saveSettings(); applySettings(); alert('Updated'); }
function changePassword(){ const np=document.getElementById('newAdminPass').value; if(np&&confirm('Change?')){ settings.admin_password=np; saveSettings(); alert('Changed'); document.getElementById('newAdminPass').value=''; } }

function playChannel(ch){
  const video = document.getElementById('tvPlayer');
  document.getElementById('nowTitle').innerHTML = `<span style="color:var(--red)">●</span> ${ch.name}`;
  if(hls){ hls.destroy(); hls=null; }
  if(Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>video.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal) document.getElementById('nowTitle').innerHTML=`<span style="color:var(--red)">●</span> ${ch.name} (Error)`; });
  } else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = ch.url;
    video.play().catch(()=>{});
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function openMenu(){ document.getElementById('menuOverlay').style.display='flex'; }
function closeMenu(){ document.getElementById('menuOverlay').style.display='none'; }
function openAdmin(){ document.getElementById('adminOverlay').style.display='flex'; document.getElementById('loginView').style.display='blo
