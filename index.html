<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Star TV - Live TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #07090e; --surface: #0f172a; --surface-card: #131d33;
      --primary: #3b82f6; --text: #f8fafc; --muted: #94a3b8;
      --red: #ef4444; --green: #10b981; --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 50px; }

    .navbar {
      background: rgba(7, 9, 14, 0.85); backdrop-filter: blur(16px);
      position: sticky; top: 0; z-index: 100; padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .menu-icon { font-size: 24px; cursor: pointer; color: var(--text); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 800; }
    .brand span { color: var(--primary); }
    .live-badge {
      background: var(--red); color: #fff; font-size: 10px; padding: 3px 8px; 
      border-radius: 6px; margin-left: 6px;
    }

    .container { max-width: 1180px; margin: 0 auto; padding: 20px 16px; }
    
    .player-box { background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 24px; border: 1px solid var(--border); }
    .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .now-playing { background: var(--surface); padding: 16px 22px; border-top: 1px solid var(--border); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-top: 20px; }
    .card { background: var(--surface-card); border-radius: 14px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); position: relative; }
    .card:hover { border-color: var(--primary); }
    .banner { height: 95px; display: flex; align-items: center; justify-content: center; background: #1e3a8a; }
    .banner span { font-size: 13px; font-weight: 800; padding: 0 10px; text-transform: uppercase; }
    .info { padding: 12px 14px; }
    .name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat-label { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .offline-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); color: var(--red); font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; border: 1px solid var(--red); }
    .card.offline { opacity: 0.5; pointer-events: none; }

    /* Admin Panel */
    .admin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .admin-panel { background: var(--surface); width: 95%; max-width: 600px; border-radius: 16px; padding: 24px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
    .close-btn { cursor: pointer; font-size: 20px; color: var(--red); font-weight: bold;}
    
    .admin-section { background: var(--surface-card); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .admin-input { width: 100%; padding: 12px; margin-bottom: 10px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    .admin-btn { background: var(--primary); color: #fff; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    .admin-btn.danger { background: var(--red); }
    
    /* Admin Channel List */
    .admin-ch-list { max-height: 200px; overflow-y: auto; margin-top: 10px; }
    .admin-ch-item { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border); }
    .ch-actions button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; color: white; margin-left: 5px; font-size: 11px; }
    .btn-off { background: #d97706; }
    .btn-del { background: var(--red); }

    /* Viewers UI */
    .viewer-item { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border); }
    .v-info { display: flex; flex-direction: column; }
    .v-ip { font-size: 11px; color: var(--muted); }
    .v-kick { background: var(--red); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }

    #loginView, #dashboardView { display: none; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="menu-icon" onclick="openAdmin()">☰</div>
      <div class="brand">
        <div>STAR <span>TV</span><span class="live-badge">LIVE</span></div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="player-box">
      <div class="player-wrap">
        <video id="tvPlayer" controls></video>
      </div>
      <div class="now-playing">
        <h2 id="nowTitle"><span style="color:var(--red)">●</span> Select a Channel</h2>
      </div>
    </div>

    <h3 style="font-size: 18px; margin-bottom: 15px;">Live Channels</h3>
    <div class="grid" id="channelGrid">
      <!-- Channels will load here dynamically -->
    </div>
  </div>

  <!-- Admin Panel Overlay -->
  <div class="admin-overlay" id="adminOverlay">
    <div class="admin-panel">
      
      <!-- Login View -->
      <div id="loginView">
        <div class="admin-header">
          <h2>Admin Login</h2>
          <div class="close-btn" onclick="closeAdmin()">✖</div>
        </div>
        <input type="password" id="adminPass" class="admin-input" placeholder="Enter Password">
        <button class="admin-btn" onclick="checkLogin()">Login</button>
        <p id="loginError" style="color: var(--red); font-size: 12px; margin-top: 10px; display: none;">Wrong Password!</p>
      </div>

      <!-- Dashboard View -->
      <div id="dashboardView">
        <div class="admin-header">
          <h2>Admin Dashboard</h2>
          <div class="close-btn" onclick="closeAdmin()">✖</div>
        </div>

        <div class="admin-section">
          <h3 style="margin-bottom: 10px;">Add New Channel</h3>
          <input type="text" id="chName" class="admin-input" placeholder="Channel Name (e.g., Star Plus)">
          <input type="text" id="chCat" class="admin-input" placeholder="Category (e.g., Hindi, News)">
          <input type="text" id="chUrl" class="admin-input" placeholder="Stream URL (.m3u8)">
          <button class="admin-btn" onclick="addNewChannel()">+ Add Channel</button>
        </div>

        <div class="admin-section">
          <h3 style="margin-bottom: 10px;">Manage Added Channels</h3>
          <div class="admin-ch-list" id="adminChList">
            <!-- Admin channel items here -->
          </div>
        </div>

        <div class="admin-section">
          <h3 style="margin-bottom: 10px;">Live Viewers (System UI)</h3>
          <div class="viewer-item">
            <div class="v-info">
              <span>User ID: #8849</span>
              <span class="v-ip">IP: 103.11.x.x • Watching: Star TV</span>
            </div>
            <button class="v-kick" onclick="this.parentElement.style.display='none'">Kick</button>
          </div>
          <div class="viewer-item">
            <div class="v-info">
              <span>User ID: #8850</span>
              <span class="v-ip">IP: 45.22.x.x • Watching: Star TV</span>
            </div>
            <button class="v-kick" onclick="this.parentElement.style.display='none'">Kick</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin123";
    let channels = JSON.parse(localStorage.getItem('star_tv_channels')) || [];
    let hls = null;

    // Load Channels to Grid
    function renderChannels() {
      const grid = document.getElementById("channelGrid");
      const adminList = document.getElementById("adminChList");
      grid.innerHTML = "";
      adminList.innerHTML = "";

      if(channels.length === 0) {
        grid.innerHTML = `<div style="color: var(--muted); grid-column: 1/-1;">No channels found. Open Admin Panel (☰) to add channels.</div>`;
        return;
      }

      channels.forEach((ch, index) => {
        // Front-End Grid
        const card = document.createElement('div');
        card.className = `card ${ch.isOffline ? 'offline' : ''}`;
        card.onclick = () => !ch.isOffline && playChannel(ch);
        
        card.innerHTML = `
          <div class="banner">
            <span>${ch.name.substring(0,12)}</span>
            ${ch.isOffline ? '<div class="offline-badge">OFFLINE</div>' : ''}
          </div>
          <div class="info">
            <div class="name">${ch.name}</div>
            <div class="cat-label">${ch.category}</div>
          </div>
        `;
        grid.appendChild(card);

        // Admin List
        const aItem = document.createElement('div');
        aItem.className = 'admin-ch-item';
        aItem.innerHTML = `
          <div style="font-size:13px; font-weight:bold;">${ch.name} <span style="font-weight:normal; color:#888;">(${ch.category})</span></div>
          <div class="ch-actions">
            <button class="btn-off" onclick="toggleOffline(${index})">${ch.isOffline ? 'Make Online' : 'Set Offline'}</button>
            <button class="btn-del" onclick="deleteChannel(${index})">Delete</button>
          </div>
        `;
        adminList.appendChild(aItem);
      });
    }

    // Play Channel
    function playChannel(ch) {
      const video = document.getElementById('tvPlayer');
      document.getElementById('nowTitle').innerHTML = `<span style="color:var(--red)">●</span> ${ch.name}`;
      
      if (hls) { hls.destroy(); }
      
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = ch.url;
        video.play();
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Add Channel
    function addNewChannel() {
      const name = document.getElementById('chName').value;
      const cat = document.getElementById('chCat').value;
      const url = document.getElementById('chUrl').value;

      if(!name || !url) return alert("Name and URL are required!");

      channels.push({ name, category: cat || "General", url, isOffline: false });
      localStorage.setItem('star_tv_channels', JSON.stringify(channels));
      
      document.getElementById('chName').value = "";
      document.getElementById('chCat').value = "";
      document.getElementById('chUrl').value = "";
      
      renderChannels();
      alert("Channel Added Successfully!");
    }

    // Delete Channel
    function deleteChannel(index) {
      if(confirm("Are you sure you want to delete this channel?")) {
        channels.splice(index, 1);
        localStorage.setItem('star_tv_channels', JSON.stringify(channels));
        renderChannels();
      }
    }

    // Toggle Offline Status
    function toggleOffline(index) {
      channels[index].isOffline = !channels[index].isOffline;
      localStorage.setItem('star_tv_channels', JSON.stringify(channels));
      renderChannels();
    }

    // Admin Panel Controls
    function openAdmin() {
      document.getElementById('adminOverlay').style.display = 'flex';
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('adminPass').value = '';
    }

    function closeAdmin() {
      document.getElementById('adminOverlay').style.display = 'none';
    }

    function checkLogin() {
      const pass = document.getElementById('adminPass').value;
      if(pass === ADMIN_PASSWORD) {
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'block';
        document.getElementById('loginError').style.display = 'none';
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    // Initial Load
    renderChannels();
  </script>
</body>
</html>
