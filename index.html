<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IPTV Max - Live TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0c1017;
      --surface: #151c2c;
      --surface2: #1c2538;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --red: #ef4444;
      --border: rgba(255,255,255,0.07);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
    
    /* Navbar */
    .navbar {
      background: rgba(12,16,23,0.92);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
      padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
    .brand span { color: var(--primary); }
    .live-badge {
      background: var(--red); color: #fff; font-size: 10px; font-weight: 700;
      padding: 3px 7px; border-radius: 4px; margin-left: 8px; vertical-align: middle;
    }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.45; font-size: 13px; }
    .search-box {
      width: 100%; max-width: 280px; padding: 9px 14px 9px 36px;
      border-radius: 22px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 13.5px; outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--primary); }

    .container { max-width: 1140px; margin: 0 auto; padding: 16px; }

    /* Player */
    .player-box {
      background: #000; border-radius: var(--radius); overflow: hidden;
      margin-bottom: 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .now-playing {
      background: var(--surface); padding: 14px 18px;
      border-top: 1px solid var(--border);
    }
    .now-playing h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .now-playing p { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* Categories */
    .cats {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); padding: 7px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn:hover { border-color: var(--primary); color: var(--text); }
    .cat-btn.active {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }

    .section-title { font-size: 17px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .channel-count { font-size: 13px; color: var(--muted); font-weight: 400; }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface); border-radius: 11px; overflow: hidden;
      cursor: pointer; border: 1px solid var(--border);
      transition: transform 0.15s, border-color 0.15s;
      position: relative;
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(59,130,246,0.4); }
    .card.active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .card.off { opacity: 0.55; }
    .banner {
      height: 90px; display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .banner span {
      font-size: 12.5px; font-weight: 700; color: rgba(255,255,255,0.93);
      text-align: center; padding: 0 8px; line-height: 1.25; letter-spacing: 0.2px;
    }
    .overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: 0.2s;
    }
    .card:hover .overlay { opacity: 1; }
    .play-btn {
      width: 36px; height: 36px; background: var(--primary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px; padding-left: 2px;
    }
    .info { padding: 10px 11px 12px; }
    .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat-label { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .off-badge {
      position: absolute; top: 7px; right: 7px;
      background: var(--red); color: #fff; font-size: 9px; font-weight: 700;
      padding: 2px 6px; border-radius: 4px; z-index: 5; letter-spacing: 0.3px;
    }
    .loading { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
      .banner { height: 100px; }
    }
  </style>
</head>

    const PLAYLISTS = [

    const colors = [

    let allChannels = [];

    function normalizeCategory(group, name, source) {
      const g = (group || "").toLowerCase();
      const n = (name || "").toLowerCase();

      if (n.includes("animal") || n.includes("pet") || n.includes("discovery") || n.includes("nat geo") || n.includes("national geographic")) return "Pets";
      if (source.includes("bd.m3u") || n.includes("somoy") || n.includes("jamuna") || n.includes("ntv") || n.includes("rtv") || n.includes("gazi") || n.includes("maasranga") || n.includes("boishakhi") || n.includes("btv") || n.includes("channel i") || n.includes("independent") || n.includes("ekattor") || n.includes("atn news")) return "Bangladesh";
      if (g.includes("bangla") || n.includes("bangla") || n.includes("jalsha") || n.includes("zee bangla") || n.includes("colors bangla") || n.includes("star jalsha") || n.includes("sony aath") || n.includes("aamar") || n.includes("enterr10")) return "Bangla";
      if (n.includes("star plus") || n.includes("colors") || n.includes("zee tv") || n.includes("sony sab") || n.includes("sony tv") || n.includes("star bharat") || n.includes("&tv") || n.includes("and tv") || (g.includes("hindi") && !n.includes("bangla"))) return "Hindi";
      if (g.includes("news") || n.includes("news") || n.includes("aaj tak") || n.includes("ndtv") || n.includes("republic") || n.includes("zee news") || n.includes("abp") || n.includes("24 ghanta") || n.includes("india today")) return "News";
      if (g.includes("music") || n.includes("music") || n.includes("9xm") || n.includes("9x") || n.includes("b4u music") || n.includes("zoom") || n.includes("mtv") || n.includes("yrf")) return "Music";
      if (g.includes("movie") || n.includes("movie") || n.includes("cinema") || n.includes("b4u") || n.includes("gold") || n.includes("max") || n.includes("jalsha movies")) return "Movies";
      if (g.includes("sport") || n.includes("sport") || n.includes("cricket") || n.includes("ten") || n.includes("star sports") || n.includes("t sports")) return "Sports";
      return "Entertainment";
    }

    function parseM3U(text, source = "") {
      const lines = text.split('\n');
      const channels = [];
      let current = null;

      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const nameMatch = line.match(/,(.+)$/);
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          const name = nameMatch ? nameMatch[1].trim() : "Unknown";
          let category = groupMatch ? groupMatch[1] : "General";
          category = normalizeCategory(category, name, source);
          current = { name, category, url: null };
        } else if (line && !line.startsWith('#') && current) {
          current.url = line;
          if (current.url.startsWith('http')) {
            channels.push({
              id: Date.now() + Math.random(),
              name: current.name,
              category: current.category,
              url: current.url,
              color: colors[Math.floor(Math.random() * colors.length)],
              status: "unknown",
              priority: false
            });
          }
          current = null;
        }
      }
      return channels;
    }

    async function checkStream(url) {
      try {
        const controller = new AbortController();
        const t = setTimeout(() => controller.abort(), 3200);
        const res = await fetch(url, { method: "GET", signal: controller.signal, mode: "cors" });
        clearTimeout(t);
        if (!res.ok) return false;
        const txt = await res.text();
        return txt.includes("#EXTM3U") || txt.includes("#EXTINF") || txt.includes(".ts");
      } catch {
        return false;
      }
    }

    async function loadAllChannels() {
      grid.innerHTML = `<div class="loading">Loading channels & checking status...</div>`;
      nowTitle.innerHTML = `<span style="color:var(--red)">●</span> Loading channels...`;
      nowCat.innerText = "Please wait";

      let loaded = [];

      // Priority channels first
      PRIORITY.forEach((p, i) => {
        loaded.push({
          id: 9000 + i,
          name: p.name,
          category: p.category,
          url: p.url,
          color: colors[i % colors.length],
          status: "unknown",
          priority: true
        });
      });

      for (const url of PLAYLISTS) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const text = await res.text();
          loaded = loaded.concat(parseM3U(text, url));
        } catch (e) {}
      }

      // Deduplicate
      const unique = [];
      const seen = new Set();
      for (const ch of loaded) {
        const key = ch.name.toLowerCase().replace(/\s+/g, "") + "|" + ch.url;
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(ch);
        }
      }

      // Status check (limited for performance)
      const toCheck = unique.slice(0, 65);
      await Promise.allSettled(toCheck.map(async ch => {
        ch.status = await checkStream(ch.url) ? "online" : "offline";
      }));
      unique.forEach(ch => { if (ch.status === "unknown") ch.status = "offline"; });

      // Sort: Online → Priority → Rest
      unique.sort((a, b) => {
        if (a.status === "online" && b.status !== "online") return -1;
        if (a.status !== "online" && b.status === "online") return 1;
        if (a.priority && !b.priority) return -1;
        if (!a.priority && b.priority) return 1;
        return 0;
      });

      allChannels = unique;
      document.getElementById("channelCount").innerText = `(${allChannels.length})`;
      renderGrid(allChannels);

      nowTitle.innerHTML = `<span style="color:var(--red)">●</span> Select a channel`;
      nowCat.innerText = `${allChannels.length} channels loaded • Online channels on top`;

      const first = allChannels.find(c => c.status === "online") || allChannels[0];
      if (first) setTimeout(() => playChannel(first.id), 600);
    }

    function play
