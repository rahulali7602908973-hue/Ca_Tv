<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Star Entertainment Live</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #f3f4f6; min-height: 100vh; padding-bottom: 40px; }

    /* Header */
    .header {
      background: #111827; padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937;
      position: sticky; top: 0; z-index: 50;
    }
    .brand { font-size: 18px; font-weight: 800; color: #3b82f6; }
    .brand span { color: #ef4444; }
    .header-btns { display: flex; gap: 8px; }
    .btn {
      background: #2563eb; color: #fff; border: none; padding: 7px 12px;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-danger { background: #dc2626; }

    .container { max-width: 1000px; margin: 0 auto; padding: 12px; }

    /* Video Player */
    .player-box { background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
    .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .player-info { padding: 10px 14px; background: #111827; border-top: 1px solid #1f2937; }
    .player-info h3 { font-size: 15px; }
    .player-info p { font-size: 12px; color: #9ca3af; margin-top: 2px; }

    /* Filter & Search */
    .controls { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .search-input {
      flex: 1; min-width: 150px; background: #1f2937; border: 1px solid #374151;
      padding: 8px 12px; border-radius: 6px; color: #fff; font-size: 13px; outline: none;
    }
    .cat-btn {
      background: #1f2937; border: 1px solid #374151; color: #9ca3af;
      padding: 7px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    .cat-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* Channel Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .card {
      background: #111827; border: 1px solid #1f2937; border-radius: 8px;
      overflow: hidden; cursor: pointer; position: relative;
    }
    .card.active { border-color: #3b82f6; box-shadow: 0 0 0 2px #3b82f6; }
    .card-banner {
      height: 75px; background: linear-gradient(135deg, #1e3a8a, #0f172a);
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 6px; font-size: 12px; font-weight: 700; color: #fff;
    }
    .card-body {
      padding: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .card-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
    .del-btn {
      background: rgba(239, 68, 68, 0.2); color: #ef4444; border: none;
      width: 22px; height: 22px; border-radius: 4px; font-size: 11px; cursor: pointer;
    }

    /* Simple Modal */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: #111827; border: 1px solid #374151; width: 100%; max-width: 400px;
      border-radius: 8px; padding: 16px;
    }
    .modal-box h4 { margin-bottom: 12px; font-size: 15px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 4px; }
    .form-input {
      width: 100%; padding: 8px 10px; background: #1f2937; border: 1px solid #374151;
      border-radius: 6px; color: #fff; font-size: 13px; outline: none;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">STAR <span>LIVE</span></div>
    <div class="header-btns">
      <button class="btn" onclick="openAddModal()">+ Add Channel</button>
      <button class="btn btn-danger" onclick="resetChannels()">Reset</button>
    </div>
  </div>

  <div class="container">
    <!-- Player -->
    <div class="player-box">
      <div class="player-wrap">
        <video id="tvPlayer" controls playsinline webkit-playsinline></video>
      </div>
      <div class="player-info">
        <h3 id="playerTitle">Select a Channel</h3>
        <p id="playerStatus">Click any channel card below to start playing</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="controls">
      <input type="text" id="searchBox" class="search-input" placeholder="Search channels..." oninput="render()">
      <button class="cat-btn active" onclick="setCategory('All', this)">All</button>
      <button class="cat-btn" onclick="setCategory('Bangla', this)">Bangla</button>
      <button class="cat-btn" onclick="setCategory('Hindi', this)">Hindi</button>
    </div>

    <!-- Grid -->
    <div class="grid" id="channelGrid"></div>
  </div>

  <!-- Add Channel Modal -->
  <div class="modal" id="addModal">
    <div class="modal-box">
      <h4>Add Custom Channel</h4>
      <div class="form-group">
        <label>Channel Name</label>
        <input type="text" id="addName" class="form-input" placeholder="e.g. Aaj Tak">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="addCat" class="form-input">
          <option value="Bangla">Bangla</option>
          <option value="Hindi">Hindi</option>
        </select>
      </div>
      <div class="form-group">
        <label>Stream URL (.m3u8)</label>
        <input type="text" id="addUrl" class="form-input" placeholder="https://domain.com/live.m3u8">
      </div>
      <div class="modal-actions">
        <button class="cat-btn" onclick="closeAddModal()">Cancel</button>
        <button class="btn" onclick="saveNewChannel()">Save Channel</button>
      </div>
    </div>
  </div>

  <script>
    // 100% Reliable Official Streams
    const DEFAULT_LIST = [
      { id: 1, name: "ABP Ananda", cat: "Bangla", url: "https://abpanandahls.akamaized.net/hls/live/2021588/abpanandahls/master.m3u8" },
      { id: 2, name: "News18 Bangla", cat: "Bangla", url: "https://n18bangla.akamaized.net/hls/live/2014264/n18bangla/master.m3u8" },
      { id: 3, name: "Aaj Tak HD", cat: "Hindi", url: "https://feeds.intoday.in/aajtak/api/aajtakhd/master.m3u8" },
      { id: 4, name: "India TV", cat: "Hindi", url: "https://indiatvnews.akamaized.net/hls/live/2028682/indiatv/master.m3u8" },
      { id: 5, name: "ABP News", cat: "Hindi", url: "https://abphindi.akamaized.net/hls/live/2021587/abphindi/master.m3u8" },
      { id: 6, name: "Republic Bharat", cat: "Hindi", url: "https://rbharat.akamaized.net/hls/live/2014265/rbharat/master.m3u8" },
      { id: 7, name: "Big Buck Bunny (Live Test)", cat: "Hindi", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
    ];

    let channels = [];
    let activeCat = "All";
    let activeId = null;
    let hls = null;

    const video = document.getElementById("tvPlayer");
    const pTitle = document.getElementById("playerTitle");
    const pStatus = document.getElementById("playerStatus");
    const grid = document.getElementById("channelGrid");
    const search = document.getElementById("searchBox");

    // Load Data
    function loadData() {
      try {
        const saved = localStorage.getItem("star_lite_v1");
        channels = saved ? JSON.parse(saved) : DEFAULT_LIST;
      } catch(e) {
        channels = DEFAULT_LIST;
      }
      render();
    }

    function saveData() {
      localStorage.setItem("star_lite_v1", JSON.stringify(channels));
    }

    // Render Channels
    function render() {
      const q = search.value.toLowerCase().trim();
      grid.innerHTML = "";

      const filtered = channels.filter(c => {
        const matchCat = (activeCat === "All" || c.cat === activeCat);
        const matchSearch = c.name.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #6b7280; padding: 20px;">No channels found. Click '+ Add Channel' to add one.</div>`;
        return;
      }

      filtered.forEach(c => {
        const card = document.createElement("div");
        card.className = `card ${activeId === c.id ? 'active' : ''}`;
        card.onclick = () => playStream(c);

        card.innerHTML = `
          <div class="card-banner">${c.name}</div>
          <div class="card-body">
            <span class="card-title">${c.name}</span>
            <button class="del-btn" onclick="deleteChannel(event, ${c.id})">&times;</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Play Stream
    function playStream(c) {
      activeId = c.id;
      pTitle.innerText = c.name;
      pStatus.innerText = "Loading stream...";
      render();

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(c.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().then(() => {
            pStatus.innerText = "Playing Live • Sound Enabled";
          }).catch(() => {
            video.muted = true;
            video.play();
            pStatus.innerText = "Playing Muted • Click video to unmute";
          });
        });
        hls.on(Hls.Events.ERROR, () => {
          pStatus.innerText = "Stream offline or invalid link";
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = c.url;
        video.play();
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Filters
    function setCategory(cat, el) {
      activeCat = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
      render();
    }

    // Delete Channel
    function deleteChannel(e, id) {
      e.stopPropagation();
      channels = channels.filter(c => c.id !== id);
      saveData();
      render();
    }

    // Modal Operations
    function openAddModal() { document.getElementById("addModal").classList.add("show"); }
    function closeAddModal() { document.getElementById("addModal").classList.remove("show"); }

    function saveNewChannel() {
      const name = document.getElementById("addName").value.trim();
      const cat = document.getElementById("addCat").value;
      const url = document.getElementById("addUrl").value.trim();

      if (!name || !url) {
        alert("Please enter Name and URL");
        return;
      }

      channels.unshift({ id: Date.now(), name, cat, url });
      saveData();
      render();

      document.getElementById("addName").value = "";
      document.getElementById("addUrl").value = "";
      closeAddModal();
    }

    // Reset Defaults
    function resetChannels() {
      if (confirm("Reset to default channels list?")) {
        localStorage.removeItem("star_lite_v1");
        channels = DEFAULT_LIST;
        saveData();
        render();
      }
    }

    // Start
    loadData();
  </script>
</body>
</html>
