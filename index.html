<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IPTV Max - Live TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #1a2235;
      --primary: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 30px; -webkit-tap-highlight-color: transparent; }
    .navbar { background: rgba(11,15,25,0.96); position: sticky; top: 0; z-index: 100; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .brand { font-size: 19px; font-weight: 800; }
    .brand span { color: var(--primary); }
    .live { background: var(--red); color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 3px; margin-left: 5px; }
    .search-box { width: 100%; max-width: 260px; padding: 8px 12px 8px 32px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); background: var(--surface); color: #fff; font-size: 13px; outline: none; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 12px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 12px; }
    .player-box { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
    .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .now { background: var(--surface); padding: 11px 14px; }
    .now h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
    .now p { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .cats { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--surface); border: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding: 6px 13px; border-radius: 18px; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .title { font-size: 16px; font-weight: 600; margin-bottom: 11px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 11px; }
    .card { background: var(--surface); border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.06); }
    .card.active { border-color: var(--primary); }
    .banner { height: 85px; display: flex; align-items: center; justify-content: center; position: relative; }
    .banner span { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.92); text-align: center; padding: 0 5px; }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; }
    .card:active .overlay { opacity: 1; }
    .play { width: 34px; height: 34px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; padding-left: 2px; }
    .info { padding: 9px; }
    .name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
      .banner { height: 100px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand">IPTV<span>MAX</span><span class="live">LIVE</span></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-box" placeholder="চ্যানেল খুঁজুন..." onkeyup="filterChannels()">
    </div>
  </nav>

  <div class="container">
    <div class="player-box">
      <div class="player-wrap">
        <video id="tvPlayer" controls playsinline webkit-playsinline></video>
      </div>
      <div class="now">
        <h2 id="nowPlayingTitle"><span style="color:var(--red)">●</span> চ্যানেল নির্বাচন করুন</h2>
        <p id="nowPlayingCat">যেকোনো চ্যানেলে ক্লিক করুন</p>
      </div>
    </div>

    <div class="cats">
      <button class="cat-btn active" onclick="filterByCategory('All')">সকল</button>
      <button class="cat-btn" onclick="filterByCategory('Bangla')">বাংলা</button>
      <button class="cat-btn" onclick="filterByCategory('News')">News</button>
      <button class="cat-btn" onclick="filterByCategory('Music')">Music</button>
      <button class="cat-btn" onclick="filterByCategory('Movies')">Movies</button>
      <button class="cat-btn" onclick="filterByCategory('Entertainment')">Entertainment</button>
      <button class="cat-btn" onclick="filterByCategory('Bangladesh')">বাংলাদেশ</button>
    </div>

    <h3 class="title">লাইভ টিভি চ্যানেল</h3>
    <div class="grid" id="channelGrid"></div>
  </div>

  <script>
    const channels = [
      // ===== বাংলা ও আঞ্চলিক =====
      { id: 1,  name: "ABP Ananda",        category: "Bangla", url: "https://d2l4ar6y3mrs4k.cloudfront.net/live-streaming/ananda-livetv/master.m3u8", color: "linear-gradient(135deg,#dc2626,#991b1b)" },
      { id: 2,  name: "TV9 Bangla",        category: "Bangla", url: "https://dyjmyiv3bp2ez.cloudfront.net/pub-iotv9banaen8yq/liveabr/playlist.m3u8", color: "linear-gradient(135deg,#2563eb,#1e3a8a)" },
      { id: 3,  name: "Enterr 10 Bangla",  category: "Bangla", url: "https://live-bangla.akamaized.net/liveabr/playlist.m3u8", color: "linear-gradient(135deg,#ec4899,#9d174d)" },
      { id: 4,  name: "Zee 24 Ghanta",     category: "Bangla", url: "https://d2dsoyvkr33m05.cloudfront.net/index_1.m3u8", color: "linear-gradient(135deg,#16a34a,#14532d)" },

      // ===== Bangladesh TV =====
      { id: 10, name: "Somoy TV",          category: "Bangladesh", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/index.m3u8", color: "linear-gradient(135deg,#dc2626,#7f1d1d)" },
      { id: 11, name: "Jamuna TV",         category: "Bangladesh", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1701/output/index.m3u8", color: "linear-gradient(135deg,#2563eb,#1e3a8a)" },
      { id: 12, name: "Channel 24",        category: "Bangladesh", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1703/output/index.m3u8", color: "linear-gradient(135deg,#16a34a,#14532d)" },
      { id: 13, name: "Independent TV",    category: "Bangladesh", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1704/output/index.m3u8", color: "linear-gradient(135deg,#7c3aed,#5b21b6)" },
      { id: 14, name: "Ekattor TV",        category: "Bangladesh", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1705/output/index.m3u8", color: "linear-gradient(135deg,#ea580c,#c2410c)" },
      { id: 15, name: "ATN News",          category: "Bangladesh", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1706/output/index.m3u8", color: "linear-gradient(135deg,#0ea5e9,#0369a1)" },
      { id: 16, name: "Channel I",         category: "Bangladesh", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1723/output/index.m3u8", color: "linear-gradient(135deg,#8b5cf6,#6d28d9)" },
      { id: 17, name: "BTV National",      category: "Bangladesh", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1709/output/index.m3u8", color: "linear-gradient(135deg,#1d4ed8,#1e3a8a)" },

      // ===== National News =====
      { id: 20, name: "Aaj Tak",           category: "News", url: "https://feeds.intoday.in/aajtak/api/aajtakhd/master.m3u8", color: "linear-gradient(135deg,#dc2626,#7f1d1d)" },
      { id: 21, name: "ABP News",          category: "News", url: "https://d2l4ar6y3mrs4k.cloudfront.net/live-streaming/abpnews-livetv/master.m3u8", color: "linear-gradient(135deg,#eab308,#713f12)" },
      { id: 22, name: "NDTV India",        category: "News", url: "https://ndtvindiaelemarchana.akamaized.net/hls/live/2003679/ndtvindia/master.m3u8", color: "linear-gradient(135deg,#2563eb,#1e3a8a)" },
      { id: 23, name: "Zee News",          category: "News", url: "https://vg-zeefta.akamaized.net/ptnr-yupptv/title-zeenews/v1/master/611d79b11b77e2f571934fd80ca1413453772ac7/8744f9fb-d696-4204-9795-5215ad930c39/main.m3u8", color: "linear-gradient(135deg,#ea580c,#7c2d12)" },
      { id: 24, name: "Republic TV",       category: "News", url: "https://d3qs3d2rkhfqrt.cloudfront.net/out/v1/2e31d831f08640ff92f65003bdc89991/index.m3u8", color: "linear-gradient(135deg,#1e40af,#1e3a8a)" },
      { id: 25, name: "DW News",           category: "News", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/master.m3u8", color: "linear-gradient(135deg,#0f766e,#134e4a)" },

      // ===== Music TV =====
      { id: 30, name: "9XM",               category: "Music", url: "https://9xjio.wiseplayout.com/9XM/master.m3u8", color: "linear-gradient(135deg,#7c3aed,#4c1d95)" },
      { id: 31, name: "9X Jhakaas",        category: "Music", url: "https://9xjio.wiseplayout.com/9X_Jhakaas/master.m3u8", color: "linear-gradient(135deg,#db2777,#831843)" },
      { id: 32, name: "9X Tashan",         category: "Music", url: "https://9xjio.wiseplayout.com/9X_Tashan/master.m3u8", color: "linear-gradient(135deg,#c026d3,#701a75)" },
      { id: 33, name: "YRF Music",         category: "Music", url: "https://cdn-uw2-prod.tsv2.amagi.tv/linear/amg01412-xiaomiasia-yrfmusic-xiaomi/playlist.m3u8", color: "linear-gradient(135deg,#f97316,#c2410c)" },
      { id: 34, name: "Zoom",              category: "Music", url: "https://d14c63magvk61v.cloudfront.net/strm/channels/zoom/master.m3u8", color: "linear-gradient(135deg,#e11d48,#9f1239)" },

      // ===== Movies & Entertainment =====
      { id: 40, name: "B4U Movies",        category: "Movies", url: "https://cdnb4u.wiseplayout.com/B4U_Movies/master.m3u8", color: "linear-gradient(135deg,#dc2626,#7f1d1d)" },
      { id: 41, name: "B4U Kadak",         category: "Movies", url: "https://cdnb4u.wiseplayout.com/B4U_Kadak/master.m3u8", color: "linear-gradient(135deg,#ea580c,#9a3412)" },
      { id: 42, name: "Bhojpuri Cinema",   category: "Movies", url: "https://live-bhojpuri.akamaized.net/liveabr/playlist.m3u8", color: "linear-gradient(135deg,#7c3aed,#5b21b6)" },
      { id: 43, name: "Shemaroo TV",       category: "Entertainment", url: "https://shemarootv-samsungin.amagi.tv/playlist.m3u8", color: "linear-gradient(135deg,#8b5cf6,#4c1d95)" }
    ];

    const video = document.getElementById("tvPlayer");
    const nowTitle = document.getElementById("nowPlayingTitle");
    const nowCat = document.getElementById("nowPlayingCat");
    const grid = document.getElementById("channelGrid");
    let currentCategory = "All";
    let hls = null;

    function playChannel(id) {
      const ch = channels.find(c => c.id === id);
      if (!ch) return;

      nowTitle.innerHTML = `<span style="color:var(--red)">●</span> ${ch.name}`;
      nowCat.innerText = "প্লে করা হচ্ছে...";

      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
      const card = document.getElementById("card-" + id);
      if (card) card.classList.add("active");

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60
        });

        hls.loadSource(ch.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {
            video.muted = true;
            video.play();
            nowCat.innerText = "মিউট অবস্থায় চলছে (শব্দ অন করুন)";
          });
        });

        hls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                nowCat.innerText = "সংযোগ সমস্যা... পুনরায় চেষ্টা চলছে";
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                nowCat.innerText = "বাফারিং ঠিক করা হচ্ছে...";
                hls.recoverMediaError();
                break;
              default:
                nowCat.innerText = "স্ট্রিম অফলাইন • অন্য চ্যানেল বেছে নিন";
                hls.destroy();
                break;
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = ch.url;
        video.play().catch(() => {
          video.muted = true;
          video.play();
        });
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderGrid(list) {
      grid.innerHTML = "";
      list.forEach(ch => {
        const div = document.createElement("div");
        div.className = "card";
        div.id = "card-" + ch.id;
        div.onclick = () => playChannel(ch.id);
        const short = ch.name.length > 12 ? ch.name.substring(0, 10) + ".." : ch.name;
        div.innerHTML = `
          <div class="banner" style="background:${ch.color}">
            <span>${short.toUpperCase()}</span>
            <div class="overlay"><div class="play">▶</div></div>
          </div>
          <div class="info">
            <div class="name">${ch.name}</div>
            <div class="cat">${ch.category}</div>
          </div>`;
        grid.appendChild(div);
      });
    }

    function filterChannels() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      let filtered = channels.filter(c => c.name.toLowerCase().includes(q));
      if (currentCategory !== "All") filtered = filtered.filter(c => c.category === currentCategory);
      renderGrid(filtered);
    }

    function filterByCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      let filtered = cat === "All" ? channels : channels.filter(c => c.category === cat);
      const q = document.getElementById("searchInput").value.toLowerCase();
      if (q) filtered = filtered.filter(c => c.name.toLowerCase().includes(q));
      renderGrid(filtered);
    }

    // অ্যাপ স্টার্ট
    renderGrid(channels);
    setTimeout(() => playChannel(1), 500);
  </script>
</body>
</html>
