<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IPTV Max - Live TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #1a2235;
      --primary: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 30px; -webkit-tap-highlight-color: transparent; }
    .navbar { background: rgba(11,15,25,0.96); position: sticky; top: 0; z-index: 100; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .brand { font-size: 19px; font-weight: 800; }
    .brand span { color: var(--primary); }
    .live { background: var(--red); color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 3px; margin-left: 5px; }
    .search-box { width: 100%; max-width: 260px; padding: 8px 12px 8px 32px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); background: var(--surface); color: #fff; font-size: 13px; outline: none; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 12px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 12px; }
    .player-box { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
    .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .now { background: var(--surface); padding: 11px 14px; }
    .now h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
    .now p { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .cats { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--surface); border: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding: 6px 13px; border-radius: 18px; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .title { font-size: 16px; font-weight: 600; margin-bottom: 11px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 11px; }
    .card { background: var(--surface); border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.06); position: relative; }
    .card.active { border-color: var(--primary); }
    .card.off { opacity: 0.65; }
    .banner { height: 85px; display: flex; align-items: center; justify-content: center; position: relative; }
    .banner span { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.92); text-align: center; padding: 0 5px; line-height: 1.2; }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; }
    .card:active .overlay { opacity: 1; }
    .play { width: 34px; height: 34px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; padding-left: 2px; }
    .info { padding: 9px; }
    .name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
    .off-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--red);
      color: white;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      z-index: 5;
    }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
      .banner { height: 100px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand">IPTV<span>MAX</span><span class="live">LIVE</span></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-box" placeholder="চ্যানেল খুঁজুন..." onkeyup="filterChannels()">
    </div>
  </nav>

  <div class="container">
    <div class="player-box">
      <div class="player-wrap">
        <video id="tvPlayer" controls playsinline webkit-playsinline></video>
      </div>
      <div class="now">
        <h2 id="nowPlayingTitle"><span style="color:var(--red)">●</span> চ্যানেল লোড হচ্ছে...</h2>
        <p id="nowPlayingCat">অনুগ্রহ করে অপেক্ষা করুন</p>
      </div>
    </div>

    <div class="cats" id="categoryBar">
      <button class="cat-btn active" onclick="filterByCategory('All')">সকল</button>
      <button class="cat-btn" onclick="filterByCategory('Bangla')">বাংলা</button>
      <button class="cat-btn" onclick="filterByCategory('Bangladesh')">বাংলাদেশ</button>
      <button class="cat-btn" onclick="filterByCategory('News')">News</button>
      <button class="cat-btn" onclick="filterByCategory('Music')">Music</button>
      <button class="cat-btn" onclick="filterByCategory('Movies')">Movies</button>
      <button class="cat-btn" onclick="filterByCategory('Entertainment')">Entertainment</button>
      <button class="cat-btn" onclick="filterByCategory('Sports')">Sports</button>
    </div>

    <h3 class="title">লাইভ টিভি চ্যানেল (<span id="channelCount">0</span>)</h3>
    <div class="grid" id="channelGrid">
      <div class="loading">চ্যানেল লোড + স্ট্যাটাস চেক হচ্ছে...</div>
    </div>
  </div>

  <script>
    const PLAYLISTS = [
      "https://iptv-org.github.io/iptv/countries/bd.m3u",
      "https://iptv-org.github.io/iptv/countries/in.m3u",
      "https://iptv-org.github.io/iptv/categories/music.m3u",
      "https://iptv-org.github.io/iptv/categories/news.m3u"
    ];

    // Priority channels (Star Jalsha + Zee Bangla)
    const PRIORITY = [
      { name: "Star Jalsha", category: "Bangla", url: "https://da86m1sqpm3o0.cloudfront.net/28072023/smil:starjalsha.smil/chunklist_b1928000.m3u8" },
      { name: "Zee Bangla", category: "Bangla", url: "https://raw.githubusercontent.com/amazeyourself/adaptive-streams/refs/heads/main/streams/in/YuppTV/ZeeBanglaHD.m3u8" },
      { name: "Star Jalsha HD", category: "Bangla", url: "http://103.161.153.165:8000/play/a00w/index.m3u8" },
      { name: "Zee Bangla HD", category: "Bangla", url: "http://103.161.153.165:8000/play/zeebnhd/index.m3u8" }
    ];

    const colors = [
      "linear-gradient(135deg,#dc2626,#991b1b)",
      "linear-gradient(135deg,#2563eb,#1e3a8a)",
      "linear-gradient(135deg,#16a34a,#14532d)",
      "linear-gradient(135deg,#7c3aed,#5b21b6)",
      "linear-gradient(135deg,#ea580c,#c2410c)",
      "linear-gradient(135deg,#0ea5e9,#0369a1)",
      "linear-gradient(135deg,#db2777,#831843)",
      "linear-gradient(135deg,#eab308,#713f12)"
    ];

    let allChannels = [];
    let currentCategory = "All";
    let hls = null;
    const video = document.getElementById("tvPlayer");
    const nowTitle = document.getElementById("nowPlayingTitle");
    const nowCat = document.getElementById("nowPlayingCat");
    const grid = document.getElementById("channelGrid");

    function normalizeCategory(group, name, source) {
      const g = (group || "").toLowerCase();
      const n = (name || "").toLowerCase();
      if (source.includes("bd.m3u") || n.includes("somoy") || n.includes("jamuna") || n.includes("ntv") || n.includes("rtv") || n.includes("gazi") || n.includes("maasranga") || n.includes("boishakhi") || n.includes("btv") || n.includes("channel i")) return "Bangladesh";
      if (g.includes("bangla") || n.includes("bangla") || n.includes("jalsha") || n.includes("zee bangla") || n.includes("colors bangla") || n.includes("star jalsha") || n.includes("sony aath")) return "Bangla";
      if (g.includes("news") || n.includes("news") || n.includes("aaj tak") || n.includes("ndtv") || n.includes("republic") || n.includes("zee news") || n.includes("abp")) return "News";
      if (g.includes("music") || n.includes("music") || n.includes("9xm") || n.includes("9x") || n.includes("b4u music") || n.includes("zoom") || n.includes("mtv")) return "Music";
      if (g.includes("movie") || n.includes("movie") || n.includes("cinema") || n.includes("b4u") || n.includes("gold")) return "Movies";
      if (g.includes("sport") || n.includes("sport") || n.includes("cricket") || n.includes("ten") || n.includes("star sports")) return "Sports";
      return "Entertainment";
    }

    function parseM3U(text, source = "") {
      const lines = text.split('\n');
      const channels = [];
      let current = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          const nameMatch = line.match(/,(.+)$/);
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          const name = nameMatch ? nameMatch[1].trim() : "Unknown";
          let category = groupMatch ? groupMatch[1] : "General";
          category = normalizeCategory(category, name, source);
          current = { name, category, url: null };
        } else if (line && !line.startsWith('#') && current) {
          current.url = line;
          if (current.url.includes('http')) {
            channels.push({
              id: Date.now() + Math.random(),
              name: current.name,
              category: current.category,
              url: current.url,
              color: colors[Math.floor(Math.random() * colors.length)],
              status: "unknown"
            });
          }
          current = null;
        }
      }
      return channels;
    }

    // Simple status check (with timeout)
    async function checkStream(url) {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(url, { method: "GET", signal: controller.signal, mode: "cors" });
        clearTimeout(timeout);
        if (!res.ok) return false;
        const text = await res.text();
        return text.includes("#EXTM3U") || text.includes("#EXTINF") || text.includes(".ts");
      } catch (e) {
        return false;
      }
    }

    async function loadAllChannels() {
      grid.innerHTML = `<div class="loading">চ্যানেল লোড + স্ট্যাটাস চেক হচ্ছে...</div>`;
      nowTitle.innerHTML = `<span style="color:var(--red)">●</span> চ্যানেল লোড হচ্ছে...`;
      nowCat.innerText = "স্ট্যাটাস চেক করা হচ্ছে...";

      let loaded = [];

      // Add Priority channels first
      PRIORITY.forEach((p, i) => {
        loaded.push({
          id: 1000 + i,
          name: p.name,
          category: p.category,
          url: p.url,
          color: colors[i % colors.length],
          status: "unknown",
          priority: true
        });
      });

      for (const url of PLAYLISTS) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const text = await res.text();
          const parsed = parseM3U(text, url);
          loaded = loaded.concat(parsed);
        } catch (e) {}
      }

      // Remove duplicates
      const unique = [];
      const seen = new Set();
      for (const ch of loaded) {
        const key = ch.name.toLowerCase().replace(/\s+/g, "") + "|" + ch.url;
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(ch);
        }
      }

      // Check status (limit to first 80 for speed)
      const toCheck = unique.slice(0, 80);
      const checkPromises = toCheck.map(async (ch) => {
        ch.status = await checkStream(ch.url) ? "online" : "offline";
      });
      await Promise.allSettled(checkPromises);

      // Mark remaining as unknown (treat as offline for sorting)
      unique.forEach(ch => {
        if (ch.status === "unknown") ch.status = "offline";
      });

      // Sort: online first, then priority, then others
      unique.sort((a, b) => {
        if (a.status === "online" && b.status !== "online") return -1;
        if (a.status !== "online" && b.status === "online") return 1;
        if (a.priority && !b.priority) return -1;
        if (!a.priority && b.priority) return 1;
        return 0;
      });

      allChannels = unique;
      document.getElementById("channelCount").innerText = allChannels.length;

      renderGrid(allChannels);
      nowTitle.innerHTML = `<span style="color:var(--red)">●</span> চ্যানেল নির্বাচন করুন`;
      nowCat.innerText = `${allChannels.length}টি চ্যানেল • অনলাইনগুলো উপরে`;

      // Auto play first online channel
      const firstOnline = allChannels.find(c => c.status === "online");
      if (firstOnline) {
        setTimeout(() => playChannel(firstOnline.id), 600);
      }
    }

    function playChannel(id) {
      const ch = allChannels.find(c => c.id === id);
      if (!ch) return;

      nowTitle.innerHTML = `<span style="color:var(--red)">●</span> ${ch.name}`;
      nowCat.innerText = ch.status === "offline" ? "স্ট্রিম অফলাইন হতে পারে" : "প্লে করা হচ্ছে...";

      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
      const card = document.getElementById("card-" + id);
      if (card) card.classList.add("active");

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 90 });
        hls.loadSource(ch.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {
            video.muted = true;
            video.play();
            nowCat.innerText = "মিউট অবস্থায় চলছে (শব্দ অন করুন)";
          });
        });

        hls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) {
            nowCat.innerText = "স্ট্রিম অফলাইন • অন্য চ্যানেল চেষ্টা করুন";
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = ch.url;
        video.play().catch(() => {
          video.muted = true;
          video.play();
        });
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderGrid(list) {
      grid.innerHTML = "";
      if (list.length === 0) {
        grid.innerHTML = `<div class="loading">কোনো চ্যানেল পাওয়া যায়নি</div>`;
        return;
      }

      list.forEach(ch => {
        const div = document.createElement("div");
        div.className = "card" + (ch.status === "offline" ? " off" : "");
        div.id = "card-" + ch.id;
        div.onclick = () => playChannel(ch.id);
        const short = ch.name.length > 14 ? ch.name.substring(0, 12) + ".." : ch.name;

        div.innerHTML = `
          ${ch.status === "offline" ? '<div class="off-badge">OFF</div>' : ''}
          <div class="banner" style="background:${ch.color}">
            <span>${short.toUpperCase()}</span>
            <div class="overlay"><div class="play">▶</div></div>
          </div>
          <div class="info">
            <div class="name">${ch.name}</div>
            <div class="cat">${ch.category}</div>
          </div>`;
        grid.appendChild(div);
      });
    }

    function filterChannels() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      let filtered = allChannels.filter(c => c.name.toLowerCase().includes(q));
      if (currentCategory !== "All") filtered = filtered.filter(c => c.category === currentCategory);
      renderGrid(filtered);
    }

    function filterByCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      let filtered = cat === "All" ? allChannels : allChannels.filter(c => c.category === cat);
      const q = document.getElementById("searchInput").value.toLowerCase();
      if (q) filtered = filtered.filter(c => c.name.toLowerCase().includes(q));
      renderGrid(filtered);
    }

    loadAllChannels();
  </script>
</body>
</html>
