<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Star Entertainment - Live TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #07090e;
      --surface: #0f172a;
      --surface-card: #131d33;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --text: #f8fafc;
      --muted: #94a3b8;
      --red: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(59, 130, 246, 0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 50px; }

    .navbar {
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(16px);
      position: sticky; top: 0; z-index: 100;
      padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 800; }
    .brand img { height: 38px; width: auto; }
    .brand span { 
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .live-badge {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff; font-size: 10px; font-weight: 800;
      padding: 3px 8px; border-radius: 6px; margin-left: 6px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 13px; }
    .search-box {
      width: 100%; max-width: 280px; padding: 10px 16px 10px 38px;
      border-radius: 30px; border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05); color: var(--text); font-size: 13px; outline: none;
    }
    .search-box:focus { border-color: var(--primary); }

    .container { max-width: 1180px; margin: 0 auto; padding: 20px 16px; }

    .player-box {
      background: #000; border-radius: 16px; overflow: hidden;
      margin-bottom: 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
    }
    .player-wrap { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; }

    .now-playing {
      background: var(--surface); padding: 16px 22px;
      border-top: 1px solid var(--border);
    }
    .now-playing h2 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .now-playing p { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .cats { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 22px; }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 8px 18px; border-radius: 24px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
      cursor: pointer; transition: all 0.2s;
    }
    .cat-btn:hover { color: #fff; }
    .cat-btn.active {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .channel-count { font-size: 13px; color: var(--muted); font-weight: 500; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .card {
      background: var(--surface-card); border-radius: 14px; overflow: hidden;
      cursor: pointer; border: 1px solid var(--border); position: relative;
      transition: all 0.2s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--border-hover); }
    .card.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
    
    .banner { height: 95px; display: flex; align-items: center; justify-content: center; position: relative; }
    .banner span { font-size: 13px; font-weight: 800; color: #fff; text-align: center; padding: 0 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
    .overlay {
      position: absolute; inset: 0; background: rgba(7, 9, 14, 0.6);
      display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s;
    }
    .card:hover .overlay { opacity: 1; }
    .play-btn {
      width: 40px; height: 40px; background: #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #000; font-size: 14px;
    }
    
    .info { padding: 12px 14px; background: var(--surface-card); }
    .name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .cat-label { font-size: 11.5px; color: var(--muted); margin-top: 3px; font-weight: 500; }
    .loading { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 15px; grid-column: 1 / -1; }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
      .banner { height: 105px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand">
      <img src="logo.png" alt="Star Entertainment" onerror="this.style.display='none'">
      <div>STAR <span>ENTERTAINMENT</span><span class="live-badge">LIVE</span></div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-box" placeholder="Search channels..." onkeyup="filterChannels()">
    </div>
  </nav>

  <div class="container">
    <div class="player-box">
      <div class="player-wrap">
        <video id="tvPlayer" controls playsinline webkit-playsinline></video>
      </div>
      <div class="now-playing">
        <h2 id="nowPlayingTitle"><span style="color:var(--red)">●</span> Select a Channel</h2>
        <p id="nowPlayingCat">Ready to stream</p>
      </div>
    </div>

    <div class="cats">
      <button class="cat-btn active" onclick="filterByCategory('All', event)">All</button>
      <button class="cat-btn" onclick="filterByCategory('Bangla', event)">Bangla</button>
      <button class="cat-btn" onclick="filterByCategory('Bangladesh', event)">Bangladesh</button>
      <button class="cat-btn" onclick="filterByCategory('News', event)">News</button>
      <button class="cat-btn" onclick="filterByCategory('Music', event)">Music</button>
      <button class="cat-btn" onclick="filterByCategory('Movies', event)">Movies</button>
      <button class="cat-btn" onclick="filterByCategory('Entertainment', event)">Entertainment</button>
    </div>

    <h3 class="section-title">Live Channels <span class="channel-count" id="channelCount">(0)</span></h3>
    <div class="grid" id="channelGrid">
      <div class="loading">Loading channel library...</div>
    </div>
  </div>

  <script>
    const PRIORITY = [
      { name: "Star Jalsha", category: "Bangla", url: "https://da86m1sqpm3o0.cloudfront.net/28072023/smil:starjalsha.smil/chunklist_b1928000.m3u8" },
      { name: "Star Jalsha HD", category: "Bangla", url: "http://103.161.153.165:8000/play/a00w/index.m3u8" },
      { name: "Zee Bangla", category: "Bangla", url: "https://raw.githubusercontent.com/amazeyourself/adaptive-streams/refs/heads/main/streams/in/YuppTV/ZeeBanglaHD.m3u8" },
      { name: "Zee Bangla HD", category: "Bangla", url: "http://103.161.153.165:8000/play/zeebnhd/index.m3u8" },
      { name: "Colors Bangla", category: "Bangla", url: "https://itpolly.iptv.digijadoo.net/live/colors_bangla_hd/playlist.m3u8" },
      { name: "Colors Bangla HD", category: "Bangla", url: "https://edge01.iptv.digijadoo.net/live/colors_bangla_hd/chunks.m3u8" },
      { name: "Sony Aath", category: "Bangla", url: "http://103.205.133.19/hls/sony8.m3u8" }
    ];

    const timestamp = Date.now();
    const PLAYLISTS = [
      `https://iptv-org.github.io/iptv/countries/bd.m3u?t=${timestamp}`,
      `https://iptv-org.github.io/iptv/countries/in.m3u?t=${timestamp}`,
      `https://iptv-org.github.io/iptv/categories/music.m3u?t=${timestamp}`,
      `https://iptv-org.github.io/iptv/categories/news.m3u?t=${timestamp}`
    ];

    const colors = [
      "linear-gradient(135deg, #1e3a8a, #0f172a)",
      "linear-gradient(135deg, #991b1b, #450a0a)",
      "linear-gradient(135deg, #065f46, #022c22)",
      "linear-gradient(135deg, #581c87, #2e1065)",
      "linear-gradient(135deg, #9a3412, #431407)",
      "linear-gradient(135deg, #075985, #082f49)",
      "linear-gradient(135deg, #831843, #500724)",
      "linear-gradient(135deg, #374151, #111827)"
    ];

    let allChannels = [];
    let currentCategory = "All";
    let hls = null;
    const video = document.getElementById("tvPlayer");
    const nowTitle = document.getElementById("nowPlayingTitle");
    const nowCat = document.getElementById("nowPlayingCat");
    const grid = document.getElementById("channelGrid");

    function normalizeCategory(group, name, source) {
      const g = (group || "").toLowerCase();
      const n = (name || "").toLowerCase();
      if (source.includes("bd.m3u") || n.includes("somoy") || n.includes("jamuna") || n.includes("ntv") || n.includes("rtv") || n.includes("gazi") || n.includes("maasranga") || n.includes("boishakhi") || n.includes("btv") || n.includes("atn") || n.includes("bangla vision")) return "Bangladesh";
      if (g.includes("bangla") || n.includes("bangla") || n.includes("jalsha") || n.includes("zee bangla") || n.includes("colors bangla") || n.includes("sony aath") || n.includes("enterr10")) return "Bangla";
      if (g.includes("news") || n.includes("news") || n.includes("aaj tak") || n.includes("ndtv") || n.includes("abp") || n.includes("24 ghanta") || n.includes("republic") || n.includes("tv9")) return "News";
      if (g.includes("music") || n.includes("music") || n.includes("9xm") || n.includes("9x") || n.includes("b4u music") || n.includes("zoom") || n.includes("yrf")) return "Music";
      if (g.includes("movie") || n.includes("movie") || n.includes("cinema") || n.includes("b4u") || n.includes("gold") || n.includes("max")) return "Movies";
      return "Entertainment";
    }

    function parseM3U(text, source = "") {
      const lines = text.split('\n');
      const channels = [];
      let current = null;
      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const nameMatch = line.match(/,(.+)$/);
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          const name = nameMatch ? nameMatch[1].trim() : "Unknown";
          let category = groupMatch ? groupMatch[1] : "General";
          category = normalizeCategory(category, name, source);
          current = { name, category, url: null };
        } else if (line && !line.startsWith('#') && current) {
          current.url = line;
          if (current.url.startsWith('http')) {
            channels.push({
              id: Date.now() + Math.random(),
              name: current.name,
              category: current.category,
              url: current.url,
              color: colors[Math.floor(Math.random() * colors.length)],
              priority: false
            });
          }
          current = null;
        }
      }
      return channels;
    }

    async function loadAllChannels() {
      let loaded = [];

      // 1. Priority channels
      PRIORITY.forEach((p, i) => {
        loaded.push({
          id: 9000 + i,
          name: p.name,
          category: p.category,
          url: p.url,
          color: colors[i % colors.length],
          priority: true
        });
      });

      // 2. Playlists fetch
      for (const url of PLAYLISTS) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) continue;
          const text = await res.text();
          loaded = loaded.concat(parseM3U(text, url));
        } catch (e) {}
      }

      // 3. Remove duplicates
      const unique = [];
      const seen = new Set();
      for (const ch of loaded) {
        const key = ch.name.toLowerCase().replace(/\s+/g, "") + "|" + ch.url;
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(ch);
        }
      }

      allChannels = unique;
      document.getElementById("channelCount").innerText = `(${allChannels.length})`;
      renderGrid(allChannels);

      // Auto-play first priority channel
      if (allChannels.length > 0) {
        playChannel(allChannels[0].id, false);
      }
    }

    function playChannel(id, userInitiated = true) {
      const ch = allChannels.find(c => c.id === id);
      if (!ch) return;

      nowTitle.innerHTML = `<span style="color:var(--red)">●</span> ${ch.name}`;
      nowCat.innerText = "Connecting live stream...";

      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
      const card = document.getElementById("card-" + id);
      if (card) card.classList.add("active");

      if (hls) { hls.destroy(); hls = null; }

      // Unmute audio directly on channel selection
      video.muted = false;
      video.volume = 1.0;

      const startPlayback = () => {
        video.play().then(() => {
          nowCat.innerText = "Playing Live • Audio ON";
        }).catch(() => {
          // Fallback only if initial page load blocks autoplay
          if (!userInitiated) {
            video.muted = true;
            video.play().catch(() => {});
            nowCat.innerText = "Click anywhere or select channel to enable audio";
          }
        });
      };

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => startPlayback());
        hls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) nowCat.innerText = "Stream offline • Try another channel";
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = ch.url;
        startPlayback();
      }

      if (userInitiated) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function renderGrid(list) {
      grid.innerHTML = "";
      if (list.length === 0) {
        grid.innerHTML = `<div class="loading">No channels match your search.</div>`;
        return;
      }
      list.forEach(ch => {
        const div = document.createElement("div");
        div.className = "card";
        div.id = "card-" + ch.id;
        div.onclick = () => playChannel(ch.id, true);
        const short = ch.name.length > 15 ? ch.name.substring(0, 13) + ".." : ch.name;
        div.innerHTML = `
          <div class="banner" style="background:${ch.color}">
            <span>${short.toUpperCase()}</span>
            <div class="overlay"><div class="play-btn">▶</div></div>
          </div>
          <div class="info">
            <div class="name">${ch.name}</div>
            <div class="cat-label">${ch.category}</div>
          </div>`;
        grid.appendChild(div);
      });
    }

    function filterChannels() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      let filtered = allChannels.filter(c => c.name.toLowerCase().includes(q));
      if (currentCategory !== "All") filtered = filtered.filter(c => c.category === currentCategory);
      renderGrid(filtered);
    }

    function filterByCategory(cat, evt) {
      currentCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      if (evt && evt.target) evt.target.classList.add("active");
      let filtered = cat === "All" ? allChannels : allChannels.filter(c => c.category === cat);
      const q = document.getElementById("searchInput").value.toLowerCase();
      if (q) filtered = filtered.filter(c => c.name.toLowerCase().includes(q));
      renderGrid(filtered);
    }

    loadAllChannels();
  </script>
</body>
</html>
